# Единая карта конфигов озвучки TSSR

# Скрипты читают через tools/voicekit/config.py (section/preset/get)

# В коде остаются только ФОЛБЭК-дефолты на случай отсутствия файла

# Единый стандарт уровня (рефы, кандидаты, реплики)

audio:
  sr: 24000
  loudness:
    i: -16.0 # EBU R128 integrated, LUFS
    tp: -1.5 # true peak, dB
    lra: 11.0 # loudness range

# Подготовка рефа (add_candidate: первые N секунд + чистка)

refs:
  target_len: 10.0 # первые секунд рефа
  silence_db: -45.0 # порог тишины для анализа (dBFS)
  pause_compress: # СЖАТИЕ пауз (обязательно для всех рефов)
    max: 0.35 # ВСЕ паузы длиннее этой — сжимаем до target, с
    target: 0.35 # целевая длина паузы после сжатия, с

# Генерация кандидатов (voice_design, VoiceDesign)

design:
  candidates: 6 # сколько кандидатов на персонажа (--n по умолчанию)
  tempo: "темп речи спокойный, неторопливый, паузы короткие"
  min_text_len: 150 # мин. длина фразы в texts (≈10с речи)
  max_text_len: 250 # макс: длиннее — риск дрейфа голоса
  temperature: 0.9 # ЕДИНАЯ конфигурация семплирования на всех кандидатов
  top_p: 0.9

# Генерация реплик (voice_batch, CosyVoice3)

batch:
  flow_temp: 0.8 # официальный параметр модели (было 1.2 — артефакты)
  cfg_rate: 0.7 # официальный (было 0.9)
  sampling: [0.8, 25.0, 0.1] # RAS: top_p, top_k, tau_r (официальные)
  seed: 42
  instruct_presets: # --emotion пресеты (англ. описания состояний)
    angry: "In a fit of rage, with intensity"
    sad: "Sadly, with a melancholic tone"
    happy: "Happily, with excitement"
    fast: "Speaking as fast as possible"
    slow: "Speaking slowly and deliberately"
    loud: "As loudly as possible"
    soft: "In a very soft voice"
    whisper: "In a soft whisper"
    russian: "Please speak in Russian, with a natural native accent"

# Нелюдские голоса (beastify): k = множитель pitch, chain = фильтры

# sub_hz/sub_vol/sub_trem = гроул-субтон (частота/громкость/дрожание)

beastify:
  orc:
    k: 0.84
    chain: "bass=g=4:f=120,highshelf=f=4000:g=-8,acompressor=threshold=-25dB:ratio=3:attack=5:release=80,acrusher=bits=12:mode=log:aa=1"
    sub_hz: 75
    sub_vol: 0.08
    sub_trem: 18
  orc_deep:
    k: 0.80
    chain: "bass=g=5:f=120,highshelf=f=3500:g=-9,acompressor=threshold=-25dB:ratio=3:attack=5:release=80,acrusher=bits=11:mode=log:aa=1"
    sub_hz: 68
    sub_vol: 0.11
    sub_trem: 14
  orc_grunt:
    k: 0.87
    chain: "bass=g=3:f=130,highshelf=f=4500:g=-6,acrusher=bits=10:mode=log:aa=1,acompressor=threshold=-22dB:ratio=2.5:attack=5:release=60"
    sub_hz: 80
    sub_vol: 0.06
    sub_trem: 22
  orc_beast:
    k: 0.82
    chain: "bass=g=6:f=130,highshelf=f=3000:g=-9,acrusher=bits=8:mode=log:aa=1,aecho=0.7:0.85:250:0.25"
    sub_hz: 62
    sub_vol: 0.13
    sub_trem: 16

  # TODO: заготовки на будущее

  demon:
    k: 0.78
    chain: "tremolo=f=6:d=0.25,highshelf=f=3000:g=-10,acrusher=bits=10:mode=log:aa=1,aecho=0.8:0.9:700:0.4"
    sub_hz: 55
    sub_vol: 0.10
    sub_trem: 9
  monster:
    k: 0.80
    chain: "bass=g=6:f=130,highshelf=f=3000:g=-9,acrusher=bits=8:mode=log:aa=1,aecho=0.7:0.85:350:0.3"
    sub_hz: 65
    sub_vol: 0.12
    sub_trem: 14
  goblin:
    k: 0.92
    chain: "bandpass=f=1200:width_type=h:w=800,highshelf=f=3500:g=-6,acrusher=bits=10:mode=log:aa=1,acompressor=threshold=-20dB:ratio=2:attack=3:release=40"
    sub_hz: 0
    sub_vol: 0
    sub_trem: 0
  goblin_nasal:
    k: 0.90
    chain: "bandpass=f=1800:width_type=h:w=600,highshelf=f=4000:g=-8,acrusher=bits=9:mode=log:aa=1,aphaser=type=t:speed=0.5:decay=0.4"
    sub_hz: 0
    sub_vol: 0
    sub_trem: 0
  goblin_chitter:
    k: 0.88
    chain: "bandpass=f=1500:width_type=h:w=700,highshelf=f=3800:g=-7,acrusher=bits=11:mode=log:aa=1,tremolo=f=12:d=0.3"
    sub_hz: 0
    sub_vol: 0
    sub_trem: 0
