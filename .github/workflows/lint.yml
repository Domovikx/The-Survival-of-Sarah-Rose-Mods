name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: oxlint
        run: npm run lint
      - name: markdownlint
        run: npm run lint:md
      - name: prettier check
        run: npm run format:check
      # Гейт корпуса: в audio/ только имена по контракту {en12}-{state6} {variant}.
      # 2026-11-20 стенд насыпал 1 851 файл бенч-имён, игра их не находила,
      # а счётчики показывали прогресс — тест падает на любом таком файле.
      - name: voice corpus contract
        run: npm run test:voice:corpus
