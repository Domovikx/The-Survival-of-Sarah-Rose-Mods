who: 'Член гарема хана Хассара в его санктуме: первая встречает прибывшую Сару и объясняет
  ей устройство жизни в гареме.

  Характер: Жизнерадостная, наивная и влюблённая в Хассара девушка: искренне уверяет,
  что он «большой мягкий» и не такой, как о нём говорят, с восторгом рассказывает,
  как он принёс ей книжку с картинками из Летхрама. Говорит откровенно и без стеснения,
  немного инфантильна.

  Отношения: С Сарой — подруга-«старокилка» гарема, наставница; с Хассаром — благоговейная
  любовь и доверие.

  Стиль речи: Болтливая, восторженная, с восклицаниями, простые искренние объяснения.'
instruct_en: Female, 18-25 years old, harem girl, petite with soft rounded curves,
  round lively face, quick bouncy movements, bright eager posture
texts:
- Ты и правда здесь! Новая прибывшая, о которой столько говорят! А я уж думала, что
  всё это слухи и выдумки, что ты не приедешь вовсе, и меня распирало от любопытства,
  так что дай мне на тебя как следует посмотреть!
- Я София, приятно познакомиться, наконец-то мы встретились! Я столько о тебе слышала,
  что уже не могла дождаться, и теперь обязательно хочу узнать тебя поближе, так что
  не вздумай прятаться от меня по углам!
- Я пошла сюда, потому что услышала о тебе столько удивительных историй, что просто
  не смогла усидеть на месте. Мне нужно было своими глазами увидеть ту, о которой
  шепчется весь замок, и, поверь, я не разочарована!
- Я делала вид, что всё хорошо, улыбалась и смеялась, как положено, но это было непросто,
  ох как непросто! Внутри всё кипело и рвалось наружу, а снаружи я держала лицо, потому
  что показывать слабость здесь нельзя.
- Ты удивительная, и я надеюсь, что ты это знаешь, потому что кто-то же должен тебе
  об этом говорить! Рядом с тобой хочется жить громче, смеяться заразительнее и не
  бояться того, что подумают другие.
