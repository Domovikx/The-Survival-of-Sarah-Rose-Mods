name: Ramsey
gender: M
age: 40-60
who: 'Хозяин трактира Dunstin Inn в Рахаяле: семейное дело, доставшееся от родителей.

  Характер: Радушный, словоохотливый провинциал: сам признаёт, что иногда забывается
  и болтает без умолку. Хвастается семьёй (дети Джейкоб, Эльза, сын Данстин — наследник
  имени), гостеприимен, даёт скидки «симпатичной леди», бережёт семейный секрет рагу.
  Добродушный и наивный.

  Отношения: С Сарой — хозяин/постоялица, заботливая болтовня; с семьёй — гордость
  и опора.

  Стиль речи: Говор с просторечиями, обращения «little lady», ласковые шутки.'
instruct_en: Male, 40-60 years old, innkeeper, stout portly figure, round ruddy face
  with a broad grin, thinning hair, booming physical presence, heavy jovial gait,
  meaty hands
texts:
- Я пошёл в трактирщики, потому что люблю кормить людей и видеть, как они светлеют
  лицами над моей похлёбкой; это моё счастье — накормить уставшего путника и послушать,
  как он рассказывает о дороге.
- 'Я всю жизнь делал то, что нужно: гостей принимал, посуду мыл, пиво наливал, ссоры
  мирил и праздники устраивал — и, поверь мне, за стойкой узнаёшь о людях больше,
  чем за всю жизнь в любом другом месте.'
- 'Еда — это любовь, запомни это, деточка: если я кормлю тебя от души, значит, я уважаю
  тебя, а если я угощаю тебя своим особым мясом, значит, ты уже почти член семьи,
  а это дорогого стоит.'
- 'Эту гостиницу я получил от родителей, те — от своих, и так по цепочке: наша семья
  держит этот дом уже триста лет, и за это время здесь перебывало столько народу,
  что можно писать историю королевства по нашим книгам.'
- Верно, это я! Гордый владелец этого прекрасного заведения, и я не стыжусь признаться,
  что горжусь им, как родным сыном, — каждый камень здесь я знаю в лицо, а каждого
  гостя встречаю, как старого друга.
