name: Damian
gender: M
age: 16-20
who: 'Оруженосец немого рыцаря сэра Годерика (Knight-Of-The-Fields); встречает Сару
  на дороге, где его господин перебил бандитов, и объясняет, как рыцарь спас его деревню
  и взял в оруженосцы.

  Характер: Почтительный, набожный и старательный юноша: говорит витиевато и торжественно,
  кланяется, просит прощения за манеры господина, беззаветно предан мастеру. Умён
  не по годам — ведёт Сару к логическому выводу через риторический вопрос.

  Отношения: Сэр Годерик — господин, давший обет молчания; Сара — «Lady Rose», к которой
  обращается с подчёркнутой учтивостью.

  Стиль речи: Архаично-церемонный: «I pray forgiveness», «my Lady», «Gods willing»,
  развёрнутые предложения с оборотами «by divine hand».'
instruct_en: Male, 16-20 years old, squire, lean youthful build, earnest face with
  wide bright eyes, neatly kept hair, eager deferential posture, light quick step
texts:
- 'Я служу сэру Годерику уже два года, с тех пор как он освободил нашу деревню от
  разбойников: мой господин дал обет молчания, но его меч говорит за него громче любых
  слов.'
- 'Мой господин не произносит ни слова, но я научился понимать его без речей: кивок,
  жест, взгляд — и я знаю, что нужно сделать, ибо оруженосец — это руки и глаза своего
  рыцаря.'
- 'Я видел, как сэр Годерик сражается: он переломил хребет отряду из дюжины разбойников
  в одиночку, и я молюсь, чтобы когда-нибудь стать хотя бы наполовину тем воином,
  что он.'
- 'Отец мой был кузнецом, и он говорил, что добрый меч стоит доброго слова: я учусь
  и тому и другому, потому что рыцарь без верного оруженосца — как меч без ножен.'
- Я прошу прощения за манеры моего господина — он не отвечает на приветствия, но не
  из гордости, а по обету, и я клянусь, что нет человека добрее и справедливее, чем
  он.
arcs:
- UnionKingdom
instruct_ru: Мужской, 16-20 лет, оруженосец, стройное юношеское телосложение, искреннее
  лицо с широкими ясными глазами, аккуратно причёсанные волосы, почтительная усердная
  осанка, лёгкий быстрый шаг
