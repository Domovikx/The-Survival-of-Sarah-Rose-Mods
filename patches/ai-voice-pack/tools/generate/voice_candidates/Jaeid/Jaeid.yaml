name: Jaeid
gender: M
age: 25-40
who: 'Эмиссар хана Хассара, уроженец касты слуг далёкого востока; привёз Сару из завоёванной
  Розанны к хану, защитил её в пути, а затем заявил на неё права и стал её покровителем
  и возлюбленным; единственный осмеливается отказать хану.

  Характер: Честный, сдержанный и верный, но мягок и романтичен: стесняется чувств,
  краснеет, шутит. Благороден до самоуничижения. Боится в бою, но спокоен, когда дело
  касается Сары; любит её «по зову сердца, а не по праву».

  Отношения: Сара — подопечная, рабыня по законам орды и его любовь; Хассар — хан,
  которому обязан всем; Джасмин — его партнёрша-картографша и близкий друг.

  Стиль речи: Уважительно-формальный («princess», «Great Khan», «my Lady»), переходящий
  в поэтичные ухаживания. Отточенные формулы чести и восточная дипломатичность.'
instruct_en: Male, 25-40 years old, emissary, lean desert-born build, sun-darkened
  weathered skin, composed upright bearing, long slender hands
texts:
- 'Я купил тебя, потому что иначе тебя купил бы кто-то гораздо хуже, и я не хочу быть
  твоим хозяином. В пустыне есть закон: спасаешь жизнь — и она становится твоей ношей,
  но я ношу свою ношу с честью.'
- Я был рабом, когда был мальчиком, и я помню, каково это, когда на тебя смотрят как
  на вещь, а не как на человека. Я не стану делать так с тобой, и пусть песок поглотит
  меня, если я солгу.
- Я знаю пустыню лучше, чем себя самого, и это не хвастовство. Каждый бархан, каждый
  источник, каждая звезда на небе — мои учителя, и я читаю их следы так же легко,
  как ты читаешь письма.
- Я бы остался с тобой, но война зовёт, и зов её сильнее моих желаний. Я вернусь,
  если смогу, а если нет — знай, что я ушёл не по своей воле и не забыл тебя.
- Я не спрашивал тебя о прошлом и не хочу, чтобы ты спрашивала о моём. Каждый из нас
  нёс своё, и песок давно засыпал следы того, что было, — так пусть они и останутся
  под ним.
- Я видел, как ты смотришь на звёзды, и я тоже когда-то смотрел на них так, будто
  они могут ответить на все вопросы. Пустыня учит, что ответы приходят не со звёзд,
  а изнутри, но это знание приходит с годами.
