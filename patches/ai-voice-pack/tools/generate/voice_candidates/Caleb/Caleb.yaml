name: Caleb
gender: M
age: 20-25
who: 'Молодой солдат-наёмник в лагере Вейлена, напарник и любовник Эфраима. Вместе
  с Эфраимом берёт Сару под опеку: знакомит с лагерем, тренирует к экзамену, спаррингует
  с ней.

  Характер: Живой, болтливый, легко возбудимый, непосредственный и дружелюбный. Открыто
  гетеро (Эфраим ''mostly goes for guys''), к Саре проявляет нежность и страсть. Добродушно
  поддразнивает, любит вино и пошлые шутки.

  Отношения: С Сарой — старший товарищ-наставник и сексуальный партнёр; с Эфраимом
  — давняя пара; с Кейт — старый знакомый.

  Стиль речи: Разговорная речь солдата: междометия, сленг, комплименты Саре на тренировках,
  в постели — откровенные похвалы и грязные фразы.'
instruct_en: Male, 20-25 years old, soldier, lean and wiry with a soldier's build,
  youthful face with a ready grin, short cropped hair, springy energetic stride, strong
  calloused hands
texts:
- 'Ты должна рассказать, как ты это сделала. Такой бросок не выходит случайно: я тренировал
  бойцов десятки раз и знаю, что этому учатся годами. Либо у тебя прирождённое чутьё,
  либо ты умело скрываешь настоящую выучку.'
- 'Обещаю, мы будем относиться к тебе как всегда. Ты одна из нас — и в бою, и у лагерного
  костра. Здесь не смотрят на происхождение: смотрят, умеешь ли ты держать строй и
  не подведёшь ли товарища в трудный час.'
- 'Спина прямая, локти выше. Ещё раз, и не щади себя: враг не будет тебя щадить, значит,
  и нам нельзя давать себе поблажек. Повторяй, пока движение не станет второй натурой,
  а потом повторишь ещё тысячу раз.'
