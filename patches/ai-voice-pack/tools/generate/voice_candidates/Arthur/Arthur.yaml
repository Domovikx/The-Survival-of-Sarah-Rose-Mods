name: Arthur
gender: M
age: 30-40
who: 'Сын Альфреда; определён как персонаж, но не произносит ни одной реплики в script.rpy
  — появляется только в названии ветки выбора и как угроза Сары. Мало данных.

  Характер: Мало данных: в тексте не говорит и не действует; по косвенным упоминаниям
  — взрослый сын Альфреда.

  Отношения: Сын Альфреда, упоминается в сцене ночного домогательства.

  Стиль речи: Мало данных: реплик нет.'
instruct_en: Male, 30-40 years old, estate heir, broad-shouldered farmer's build,
  plain weathered face with a heavy brow, work-roughened hands, steady deliberate
  gait
texts:
- 'Я вырос в этом поместье и знаю здесь каждую доску и каждый угол: отец держал меня
  при деле с малых лет, и я не привык, чтобы чужие люди совали нос в наши дела и порядки.'
- 'Я видел, как отец управляет этим домом, и знаю цену тишине: кто умеет молчать,
  когда нужно, тот и слышит больше других, а лишние разговоры здесь до добра не доводят.'
- 'Я не из тех, кто лезет в чужие дела, но и не из тех, кто спустит обиду: если кто
  тронет наше, я отвечу так, что запомнит, и не важно, кто передо мной — гость или
  свой.'
- 'Работа в поле и в мастерской выучила меня терпению: я привык ждать, когда поспеет
  урожай, и знаю, что в жизни, как и в жатве, торопиться не стоит — всё приходит в
  свой срок.'
- 'Я слышал, что по ночам в доме происходят странные вещи, но я не суеверен: я верю
  в то, что вижу своими глазами, а всё остальное оставляю на суд тех, кому положено.'
instruct_ru: Мужской, 30-40 лет, наследник поместья, коренастая крестьянская фигура,
  простое обветренное лицо с тяжёлым лбом, мозолистые руки, уверенная размеренная
  походка
