name: Gilead
gender: M
age: 40-60
who: 'Влиятельный политик Империи, слуга Вечного Двора Чёрной Пирамиды. Продвигает
  амбициозный законопроект о западных землях, интригует против соперника Калибана.
  В MagePath — хозяин поместья, где Сара работает служанкой; в BlackMonolith ведёт
  её к своему господину.

  Характер: Высокий бледный человек с грубым тяжёлым голосом; стремителен и резок.
  Жесток и скор на расправу: хватает Сару за горло. Холодный манипулятор, сам признаёт:
  ''I might be a snake, but I keep my promises''.

  Отношения: С Сарой — то как господин над служанкой, то как циничный союзник; с советниками
  — повелительно. Служит хозяину Чёрной Пирамиды, презирает врагов.

  Стиль речи: Короткие властные приказы и допросы, сарказм, риторические вопросы;
  любит говорить загадками и полунамёками.'
instruct_en: Male, 40-60 years old, imperial politician, tall and gaunt with a pale
  sharp-boned frame, narrow angular face with thin lips, dark slicked hair, rigid
  posture, quick abrupt movements
texts:
- 'Я построил это поместье своими руками, камень за камнем, и я требую в нём порядка.
  Мой дом, мои правила: каждый, кто живёт под моей крышей, обязан их знать и соблюдать,
  если не хочет оказаться за воротами.'
- Я бы не советовал тебе испытывать моё терпение — оно куда короче, чем кажется на
  первый взгляд, и я не из тех, кто прощает дважды; люди, которые это поняли слишком
  поздно, теперь вспоминают обо мне с сожалением.
- 'Я плачу за послушание и работу, а не за разговоры и рассуждения о том, как лучше
  вести дела. Это знает каждый, кто служил у меня хотя бы неделю: в моём доме сначала
  делают, а потом уже спрашивают.'
- Я на своём веку видел, как люди теряли состояние, семью и головы из-за одной-единственной
  глупости, и в моём доме такие ошибки стоят дороже, чем где бы то ни было, поэтому
  советую думать, прежде чем что-то сделать.
- Я не злой человек, каким меня иногда рисуют, — я просто не люблю, когда мои распоряжения
  обсуждают, пересказывают и переиначивают; приказ отдан, значит, он исполняется,
  и точка, а все остальные соображения оставьте при себе.
- 'Я выделил тебе комнату не потому, что я добрый и заботливый, а потому, что так
  мне спокойнее: мне проще держать тебя под рукой и знать, где ты находишься, чем
  искать тебя по всему поместью, когда ты мне понадобишься.'
arcs:
- MagePath
- BlackMonolith
instruct_ru: Мужской, 40-60 лет, имперский политик, высокий и худой, бледная остроугольная
  фигура, узкое угловатое лицо с тонкими губами, тёмные зачёсанные волосы, жёсткая
  осанка, быстрые отрывистые движения
who_codes:
- gil
