name: Xanthippe
gender: M
age: ageless
who: 'Могущественный маг из древнего ордена, в MagePath — спаситель и наставник Сары:
  вытаскивает её с улиц Летрама, учит магии годами, но преследует скрытую цель и в
  итоге пытается запереть её в цитадели. В WarriorPath — враждебный маг, которого
  Сара убивает во дворце Баграда.

  Характер: Внешне вежливый, внимательный и сострадательный, но закрытый и манипулятивный:
  держит Сару на дистанции, скрывает замысел, а при неповиновении становится жёстким
  и одержимым. Эмоциональный диапазон — от мягкой заботы до гневного приказа и оскорблений.

  Отношения: Сара — его ученица и инструмент; к ней снисходительно-покровительственен,
  требует послушания. С дворцом Баграда и королевской семьёй — союзник ордена.

  Стиль речи: Книжный, церемонный, учительский тон, назидательные монологи о предназначении,
  приказы в кризис.'
instruct_en: Male, ageless, mage, tall and gaunt with a long angular face, pale sharp
  features, long slender hands, unhurried imposing stillness
texts:
- 'Я предупреждал тебя не трогать этот камень, но ты, конечно, не послушалась. Теперь
  смотри, что ты наделала: последствия твоей опрометчивости придётся расхлёбывать
  нам обоим. Исправлять всегда труднее, чем слушать, — запомни этот урок навсегда.'
- 'Что ж, ты совершила большую ошибку, и теперь тебе придётся принять её цену. Пока
  ты жива, ты принадлежишь мне, и я научу тебя послушанию, хочешь ты того или нет:
  у меня хватит времени, терпения и способов, чтобы сломить любую гордыню.'
- Я жил, когда ваша империя была лишь пылью под моими ногами, а ваши боги — шёпотом
  в пустоте. Твои столетия, твои надежды, твоя жизнь — для меня лишь один короткий
  вздох между ударами сердца, и всё же ты осмелилась бросить мне вызов.
arcs:
- WarriorPath
- MagePath
- HollowWorld
instruct_ru: Мужской, без возраста, маг, высокий и худой, с удлинённым угловатым лицом,
  бледные острые черты, длинные тонкие руки, неторопливая внушительная неподвижность
