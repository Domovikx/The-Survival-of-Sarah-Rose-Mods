name: Gorak
gender: M
age: 40-50
who: 'Вождь оркского клана (арка HyralArc), захвативший Сару в рабство, когда она
  собирала кремень на его землях. Судит её сам и объявляет собственностью клана, а
  позже устраивает турнир, где победитель получит её в жёны.

  Характер: Жестокий, властный, с животным презрением к людям — называет Сару «human
  whore», угрожает убийством и насилием. Считает орков «настоящими мужчинами» в противовес
  людям.

  Отношения: Сара — пленница-рабыня; клан — подданные, на которых делит добычу.

  Стиль речи: Ломаный упрощённый язык с короткими рублеными фразами («Work, whore!»,
  «Say it!»), приказы и унизительные обращения.'
instruct_en: Male, 40-50 years old, orc chieftain, massive hulking frame with a broad
  bestial chest, scarred brutal face with tusks, matted dark hair, heavy ground-shaking
  stride
texts:
- Я — Горак, вождь клана, и мой суд — закон! Эта женщина взяла кремень с моей земли,
  значит, она теперь собственность клана, и так решит старейшина, а если кто против
  — пусть выйдет вперёд!
- Я сломал хребет сотне врагов и принёс клану столько добычи, что наши пещеры ломятся
  от железа и золота! Сила правит этим миром, а я — сильнейший в племени, и все это
  знают!
- Орки не прячутся за словами, как люди! Если я говорю, что она останется с нами,
  значит, так будет, ибо слово вождя крепче горного камня, а моё слово — самый твёрдый
  камень в этих горах!
- Победитель турнира получит её в жёны, как я объявил! Пусть лучшие воины клана покажут
  свою силу, ибо женщина, что пережила наш плен, достойна самого сильного из нас!
- Я видел, как рушатся человеческие крепости от нашего напора, и я вижу, как дрожат
  их воины при одном моём имени! Такова воля вождя — сеять страх и пожинать добычу!
arcs:
- HyralArc
