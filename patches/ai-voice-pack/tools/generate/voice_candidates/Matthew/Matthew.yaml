name: Matthew
gender: M
age: 25-40
who: 'Главный тюремщик западного крыла тюрьмы (PrisonPath, SailorPath): проводит интэйк
  новоприбывшей Сары (инмат-2244) и курирует её заключение.

  Характер: Сухой, бюрократичный и по-своему добродушный служака: любит «чистоту»
  своего крыла, ровно и без жестокости объясняет правила, с плоским юмором. Справедливый,
  но без лишнего участия.

  Отношения: С Сарой — надзиратель/заключённая, держит формальную дистанцию; с другими
  заключёнными — административные отношения.

  Стиль речи: Канцелярско-наставительный тон с просторечиями, нумерация и правила,
  изредка сухой юмор.'
instruct_en: Male, 25-40 years old, prison warden, stocky build in a uniform tunic,
  square clean-shaven face, short-cropped hair, stiff official posture, measured unhurried
  stride, heavy hands
texts:
- 'Вставай, заключённая. У нас тут не постоялый двор, чтобы нежиться в кровати: подъём
  по расписанию, и я не намерен повторять приказ дважды. Чем быстрее ты привыкнешь
  к порядку, тем проще тебе будет здесь жить.'
- 'Новичок? Тогда слушай меня внимательно, потому что повторять я не стану. Здесь
  свои правила: не спорить, не жаловаться, делать то, что сказано. Нарушишь — узнаешь,
  почему я держу ключи от этой тюрьмы уже десять лет.'
- 'Я пошёл работать в тюрьму, потому что другого выхода не было: война оставила меня
  без дома, без семьи и без ремесла, а здесь хотя бы платят исправно. Не жду жалости,
  просто объясняю: у каждого своя история, и моя не хуже и не лучше других.'
- 'Я делал то, что нужно, — не больше и не меньше. Мне не платят за доброту, и я не
  прошу благодарности: я слежу, чтобы здесь соблюдался закон, и делаю это честно,
  без жестокости и без послаблений. Так проще жить.'
- 'Закон — это закон, и я его исполняю. Не потому, что я злой, а потому, что без порядка
  этот мир давно бы рухнул. Если тебе кажется, что я слишком суров, вспомни: не я
  написал эти правила, я лишь слежу, чтобы их соблюдали.'
arcs:
- SailorPath
instruct_ru: Мужской, 25-40 лет, тюремный надзиратель, коренастая фигура в форменной
