name: Vaelen
gender: M
age: 25-35
who: 'Глава наёмной роты «Братья Провидения», нанятой отцом Сары для её спасения.
  В детстве (11 лет) застрял в шахте в Митрийских Южных землях, где, по его словам,
  с ним заговорила тьма и открыла ему «великий нарратив» его судьбы. Постепенно раскрывается
  как злодей: продаёт с торгов знатных женщин Баграда и требует от Сары служить его
  планам.

  Характер: Харизматичный и величественный оратор, вещает о божественном предназначении
  и «священном пути», покровительственно обращается «princess Sarah». Верит, что всё
  предопределено. За фасадом — холодный манипулятор: после поражения осыпает соперницу
  бранью и обвиняет в бесчестии.

  Отношения: Сара — рекрут, затем «Роза-рыцарь», затем враг на дуэли; Кейт — давняя
  подданная; Гидеон и другие командиры — подчинённые, которых он жёстко ставит на
  место.

  Стиль речи: Высокопарная, пророческая, театральная речь с повторами имени и обращений
  «princess»; в гневе переходит на грубую брань и уничижительные ярлыки.'
instruct_en: Male, 25-35 years old, mercenary commander, tall and athletic with a
  lean hard-built frame, sharp angular face, ramrod military posture, deliberate stride
texts:
- Я командовал подразделением, которое сломило мятежную армию, и каждый солдат в моём
  отряде знал, что я требую от него абсолютной дисциплины. Только так можно выжить,
  когда на кону стоят не золото, а жизни.
- Я делал акцент на физической подготовке и стратегическом мышлении, потому что настоящий
  воин должен быть готов к любым испытаниям. Мускулы без головы — обуза, голова без
  мускулов — мечта врага.
- Я сегодня утром провёл разведывательную операцию и вернулся с важной информацией
  о перемещениях противника. Теперь от нас требуется точность и скорость, и я не потерплю
  ни промедления, ни самодеятельности.
- Мы с тобой обсуждали план действий до мелочей, и я надеюсь, что ты будешь следовать
  инструкциям без отступлений. На поле боя импровизация — это обычно труп, и я не
  собираюсь хоронить ни себя, ни своих людей.
- Я всегда требовал от своих подчинённых абсолютной точности и своевременности выполнения
  приказов, потому что на войне каждая секунда может стоить жизни. Опоздал на мгновение
  — и платишь кровью, своей или чужой.
