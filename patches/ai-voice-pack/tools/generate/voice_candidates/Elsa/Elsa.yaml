name: Elsa
gender: F
age: 14-20
who: 'Официантка и дочь хозяина таверны Рэмси в Рахаяле, сестра занятого делами Джейкоба.
  Принимает Сару на работу в таверну и обучает её подаче заказов.

  Характер: Живая, болтливая, приветливая девушка: сразу заводит разговор, хвалит
  платье Сары, с юмором отзывается о брате. Оптимистка, радуется новой работнице и
  верит в обучение на практике.

  Отношения: Сара — новая коллега, которую опекает и обучает; Джейкоб — брат-трудоголик;
  Рэмси — отец.

  Стиль речи: Разговорная, эмоциональная, с междометиями, простые фразы и дружеские
  советы.'
instruct_en: Female, 14-20 years old, waitress, small and quick with a lively build,
  bright round face with a cheeky smile, hair tied back in a practical braid, bouncing
  energetic step, quick busy hands
texts:
- 'Не обращай на него внимания, он всегда такой: любит пошуметь при гостях, чтобы
  казаться главным. Я за стойкой уже давно и скажу тебе честно — половина его громких
  слов даже не стоит того, чтобы их слушать.'
- 'Я выросла в таверне, так что к грубым мужикам привыкла: у нас тут и пьяные забияки
  бывают, и купцы, которые думают, что им всё можно. Я научилась огрызаться так, чтобы
  не терять уважение, и держать кружку покрепче.'
- 'Мой брат Джейкоб. Иногда он бывает мудаком: влезает не в свои дела, спорит с каждым
  гостем и вечно что-то теряет. Но он мой брат, так что я его защищаю, даже когда
  он совсем этого не заслуживает.'
- 'Я пошла работать в таверне с двенадцати лет. Меня научили всему: и кружки мыть
  так, чтобы хозяин не ворчал, и считать выручку быстрее любого купца, и слушать,
  что люди говорят, когда думают, что их никто не слышит.'
- 'Мне нравится эта работа. Люди приходят и уходят, а я слышу их истории: кто-то хвастается
  удачной сделкой, кто-то жалуется на жену, а кто-то шепчет то, о чём боится сказать
  громко. И все возвращаются, потому что я умею слушать.'
arcs:
- LifeInRahayal
instruct_ru: Женский, 14-20 лет, официантка, невысокая и проворная, живое телосложение,
  светлое круглое лицо с дерзкой улыбкой, волосы, собранные в практичную косу, подпрыгивающая
  энергичная походка, быстрые занятые руки
