name: Woodland Spirit
gender: M
age: ageless
who: 'Лесной дух, поразивший Гаррета проклятием-оборотнем; в ярости от появления Сары,
  насильно завершает превращение Гаррета в зверя. Мало данных — всего 5 коротких реплик
  в одной сцене.

  Характер: Гневное, ревнивое, первобытное существо: говорит короткими обвинениями-вскриками,
  собственнически относится к «брату» Гаррету, видит мир в чёрно-белом.

  Отношения: С Гарретом — «брат», которого считает своим; с Сарой — враждебный обвинитель.

  Стиль речи: Отрывистые восклицания-обвинения, архаичный пафос, громовой угрожающий
  тон.'
instruct_en: Male, ageless forest spirit, ethereal towering form of bark and shadow,
  gaunt face with glowing eyes, gnarled branch-like limbs, no natural gait — drifts
  among the trees
texts:
- Ты пришёл в мой лес и думал, что я не узнаю? Я — дух этих деревьев, я помню каждый
  лист и каждую каплю росы, и я знаю, что ты сделал моему брату, смертный!
- Ты хочешь забрать его у меня? Ты хочешь вернуть его в мир людей, где его душу будут
  рвать на части? Нет, он останется здесь, со мной, в лесу, что дал ему вторую жизнь!
- Я видел, как твои предки рубили мои рощи и жгли мои чащи, и я помню каждый пень,
  о который они споткнулись! Теперь ты встанешь передо мной и ответишь за дела своего
  рода!
- 'Лес не прощает, и лес не забывает: я растил этого человека, как растит земля семя,
  и его кровь теперь — моя кровь, его зверь — моё дитя, и ты не отнимешь у меня своё!'
- Уходи, пока я сдерживаю свой гнев, смертный! Вернись в свои каменные гнёзда и расскажи
  людям, что лес по-прежнему бодрствует, ибо я — его голос, его стража и его месть!
arcs:
- Other
instruct_ru: Мужской, без возраста, лесной дух, бесплотная высокая фигура из коры
  и тени, измождённое лицо со светящимися глазами, узловатые ветвеподобные конечности,
  без походки — плывёт между деревьями
