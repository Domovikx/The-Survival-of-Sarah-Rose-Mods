name: Gabriel
gender: M
age: 25-40
who: 'Рыцарь, присягнувший защитник ведьмы Леди Гекаты (MagePath): сопровождает её
  и Сару в руинах, где они ищут разлом пустоты. Неизменно рядом с Гекатой, сдерживает
  её разрушительную магию и репутацию.

  Характер: Сдержанный, дисциплинированный, с сухим чувством юмора: шутит про «потерявшиеся
  города», которые сожгла бы Геката без него, ворчит, но добродушно. Верен клятве,
  честен, при этом не лишён флирта и тепла.

  Отношения: Геката — госпожа и «подопечная», он её телохранитель и единственный,
  кто позволяет себе подшучивать над ней; с Сарой — союзник, приятель, позже любовник
  втроём.

  Стиль речи: Короткие, точные, слегка ироничные реплики; говорит о долге и присяге
  без пафоса.'
instruct_en: Male, 25-40 years old, tall and broad-shouldered with a knight's muscular
  frame, clean-cut face with a strong jaw, close-cropped hair, ramrod posture, measured
  deliberate stride
texts:
- Я клялся защищать её, и я сдержу свою клятву, даже если для этого придётся пройти
  через самое пекло. Клятва для меня не пустой звук, а та самая нить, что держит мою
  жизнь в узде.
- Я говорил тебе, что это плохая идея, но ты не послушалась, и вот к чему это привело.
  Впрочем, я не в обиде — ты всегда была своенравна, и именно за это я тебя уважаю.
- Я пошёл за ней, потому что она того стоит, и я готов повторять это снова и снова.
  Не каждый день встречаешь человека, ради которого готов забыть о собственной безопасности
  и страхах.
- Я делал свой выбор каждый день, и каждый раз я выбирал её, не задумываясь и не сомневаясь.
  Так было с того самого дня, как я впервые увидел её, и так будет до самого конца.
- Мой меч служит ей, и моё сердце бьётся в такт её шагам, как бы странно это ни звучало.
  Я не умею говорить красиво, но я умею быть рядом, и этого достаточно.
arcs:
- MagePath
