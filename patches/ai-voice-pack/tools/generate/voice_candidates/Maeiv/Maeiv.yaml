name: Maeiv
gender: F
age: 40-55
who: 'Королева Нормандии, «Тихая королева», правящая десятилетиями; инициатор Союзного
  совета против митрийского вторжения; после торговли голосами становится Верховной
  королевой Союза.

  Характер: Хладнокровная, расчётливая политикесса: гостеприимная хозяйка, презрительно
  называющая подданных «счастливыми свинками у корыта». Торгуется за голоса как купец,
  при провале срывается на грубость. Гордая, самолюбивая, не прощает унижений.

  Отношения: С Сарой — настороженно-покровительственная, ценит её ум; с правителями
  Союза (Эдмонд, Антонио) — манипулирует и продавливает; с Эдмондом — открытая вражда.

  Стиль речи: Высокопарно-дипломатичная, приторно-вежливая; при давлении — резкая
  и оскорбительная. Любит метафоры, обращения «gentlemen», «dear».'
instruct_en: Female, 40-55 years old, queen, stately imposing figure, immaculate regal
  bearing, severe composed face, slow measured gait, elegant hands
texts:
- 'Раньше мы голосовали тайно, и я уважала эту традицию. Но учитывая, что сегодня
  на кону, я предлагаю голосовать открыто: пусть каждый назовёт своё решение вслух
  и ответит за него, а не прячется за занавесом, когда речь идёт о судьбе королевства.'
- 'Я правила этим королевством двадцать лет, и я знаю каждый камень его стен, каждую
  трещину и каждую тайну, которую они хранят. Двадцать лет — достаточный срок, чтобы
  понять: власть держится не на мечах, а на умении слушать и ждать.'
- 'Я пошла на этот шаг, потому что некому было больше: те, кто должен был взять на
  себя ответственность, молчали или ждали чужого приказа. Я не люблю громких слов
  о долге, но когда отступать некуда, остаётся только идти вперёд.'
- 'Я делала то, что было необходимо для моего народа, и не жалею ни об одном решении,
  даже о тех, что отняли у меня сон. Королева не имеет права на слабость: сначала
  страна, потом корона и только потом — то, чего хочется самой.'
- 'Тот, кто поведёт нас, не должен сомневаться в нашей преданности: её нельзя купить,
  её можно только заслужить — словом, делом и готовностью стоять рядом в трудный час.
  Я видела слишком много предательств, чтобы относиться к этому легко.'
