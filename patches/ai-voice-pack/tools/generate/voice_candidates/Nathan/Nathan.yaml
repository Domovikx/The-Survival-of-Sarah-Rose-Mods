name: Nathan
gender: M
age: 18-28
who: 'Слуга в поместье Гилеада (MagePath), старожил — работает там несколько лет,
  обучает новичков вроде Сары.

  Характер: Расслабленный, слегка уставший от рутины парень. Добродушно подкалывает,
  но честен: «Если будешь работать, с тобой будут справедливы. По большей части».

  Отношения: С Ким — флирт и тайная связь; с Сарой — дружелюбный старожил.

  Стиль речи: Простая разговорная речь, лёгкий юмор, самоирония; в постели — короткие
  шёпотом приказы и смешки.'
instruct_en: Male, 18-28 years old, house servant, lean young build, soft friendly
  face with a wry easy grin, tousled hair, relaxed slouching posture, easy unhurried
  gait
texts:
- Ага. А что с ней? Ты о той, что приехала на прошлой неделе, или о другой, с которой
  случилась история с простынёй на балконе? В этом доме новости расходятся быстрее,
  чем каша по столу.
- Имя? Разве она не свалила через две недели? Я ещё тогда поставил на то, что дольше
  месяца она не выдержит, и, кажется, я выиграл этот спор у конюха в этом доме, чем
  каша по столу, — слышно даже на конюшне.
- Я пошёл с тобой, потому что мне интересно. Здесь, в поместье, каждый день похож
  на предыдущий, как две капли воды, и любая новая история для меня как глоток свежего
  воздуха.
- 'Я делал то, что просили, и не спорил. Слуги в этом доме говорят мало, зато слышат
  много, и я давно понял: иногда лучше кивнуть и улыбнуться, чем спорить с теми, кто
  выше тебя по положению.'
- Ты всегда такой серьёзный? Или это новое приобретение? Я вот пробовал быть серьёзным
  однажды — чуть не заскучал до смерти, так что решил оставить это занятие для тех,
  кому оно идёт.
arcs:
- MagePath
