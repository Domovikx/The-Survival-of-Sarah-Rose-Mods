- BlackMonolith
- MagePath
instruct_ru: Мужской, без возраста, древний дух, бесплотная туманная фигура, безликая
  маска вместо лица, тёмный струящийся силуэт, растворяющийся во тьме, скользит не
  касаясь земли, походки не различить
