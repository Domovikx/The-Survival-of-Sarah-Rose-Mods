name: Razaphel
gender: M
age: ageless
who: 'Древний дух иной расы, чей мир тысячелетия назад был вплавлен в мир людей. Сам
  сбежал из коллективного разума своего народа и обманом заставил Орден магов запечатать
  его. Выступает наставником и провидцем: предупреждает Сару о Вейлене, рассказывает
  историю двух миров и Камней Судьбы.

  Характер: Туманный дух с лицом-маской: шипит, смеётся беззвучно, появляется из тьмы.
  Говорит загадками и притчами, но клянётся говорить только правду и просит прощения
  за обман. Называет Сару ''daughter-of-starlight'', почтительно и тревожно ждёт её
  встречи.

  Отношения: С Сарой — как ''старый друг'', который не забывает имён; противопоставлен
  Вейлену, которого считает врагом Сары; служит Ордену мнимой жертвой. В финале открывает,
  что прятал Камни Судьбы и ждёт часа войны.

  Стиль речи: Церемониальный, архаичный стиль с нестандартными составными именами,
  риторические вопросы, слова прощания и пророчества. Тон — спокойный, вещий, с редкими
  всплесками эмоций.'
instruct_en: Male, ageless, ancient spirit, incorporeal misty figure, featureless
  mask-like face, dark shifting silhouette that melts into shadows, glides without
  touching the ground, no discernible gait
texts:
- Это моя истинная форма, смертная, — та, что была до твоих богов и останется после
  них. Твой мир, твои боги, твои страхи — всё это лишь отголоски меня самого, тени,
  которым я позволяю существовать, пока они мне нужны.
- 'Представь, что ты наполнила чашу водой до краёв, а затем пробила дно ножом несколько
  раз и ждёшь, что вода удержится. Так выглядит твоя надежда: красивая снаружи, но
  пустая изнутри, и я вижу, как она утекает между твоих пальцев.'
- Не бойся, я не причиню тебе зла — по крайней мере, не сегодня. Страх — это всего
  лишь эхо, которое ты сама заперла внутри себя, и я слышу его, как старую мелодию,
  знакомую и почти ласковую. Однажды ты поймёшь, что я всегда был рядом.
arcs:
