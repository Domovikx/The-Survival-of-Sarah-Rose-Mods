name: Took
gender: M
age: 25-35
who: 'Персонаж определён в скрипте, но в текущем script.rpy и во всех rpy-файлах игры
  не найдено ни одной его реплики — персонаж не говорит. Указанные реплики, вероятно,
  из старой версии игры. Мало данных.

  Характер: Мало данных — реплик в текущем скрипте нет.

  Отношения: Мало данных.

  Стиль речи: Мало данных.'
instruct_en: Male, 25-35 years old, house servant, lean unobtrusive build, plain forgettable
  face, neat modest clothing, quiet careful movements, soft shuffling step
texts:
- 'Я служу в этом доме давно и знаю, как устроено всё здесь: кто входит, кто выходит,
  что подают к столу и о чём говорят за закрытыми дверями, — я умею быть невидимым,
  и это моя служба.'
- 'Меня научили, что слуга должен видеть всё и не слышать ничего: глаза и уши открыты,
  а язык за зубами, ибо слово, сказанное не вовремя, стоит слуге места, а иногда и
  жизни.'
- Я принесла... простите, я принёс вино и хлеб, как было велено, и если господин пожелает
  ещё что-нибудь, я буду ждать в коридоре, чтобы не мешать разговору, но быть под
  рукой.
- 'Этот дом старше меня, и я знаю его тайны: скрипящую ступень, дверь, что заедает,
  и комнату, куда не велено входить, — я не спрашиваю почему, я просто выполняю то,
  что сказано.'
- 'Я не ищу лучшей доли: у меня есть крыша, еда и покой, а это больше, чем имеют многие
  в этом городе, и за это я служу честно и не прошу благодарности. Хозяева ценят тех,
  кто умеет быть незаметным.'
instruct_ru: Мужской, 25-35 лет, домашний слуга, худощавая неприметная фигура, простое
  незапоминающееся лицо, опрятная скромная одежда, тихие осторожные движения, мягкая
  шаркающая походка
