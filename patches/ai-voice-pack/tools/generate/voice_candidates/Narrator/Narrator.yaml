name: Narrator
gender: F
age: 25-35
who: 'все строки без персонажа: описания, эротические сцены, внутренний монолог Сары.'
instruct_en: Female, 25-35 years old, narrator, feminine figure, soft gentle facial
  features, warm open expression, long flowing hair, relaxed poised posture, unhurried
  graceful movements
texts:
- 'Я долго стояла у калитки и смотрела на этот дом, не решаясь войти. Всё здесь было
  не так, как я помнила: другие шторы на окнах, другая дверь, другой запах, и это
  незнакомое чужое спокойствие пугало меня сильнее всего.'
- Я пришла к нему поздно ночью, сама не зная зачем, ноги будто сами принесли меня
  к его порогу. Может быть, я просто устала бояться в одиночестве, и мне нужно было
  хоть на час почувствовать себя не одной в этом мире.
- 'Я могла бы рассказать ей правду ещё тогда, в тот самый вечер, но промолчала, спрятала
  слова в себе. И теперь я расплачивалась за это каждую ночь: правда, которую мы прячем,
  всегда возвращается и стучится к нам в окно.'
- Я стояла у окна и ждала рассвета, кутаясь в холодную шаль, и поймала себя на том,
  что жду его так же, как когда-то ждала писем, которые так и не пришли, — с той же
  глупой надеждой и тем же тихим отчаянием.
- 'Я сделала всё, что могла, и даже больше, чем имела права. Остальное было уже не
  в моих силах, и эта мысль приносила странное облегчение: впервые за долгое время
  я могла сказать себе, что моя совесть чиста.'
- 'Я помнила этот город совсем другим: тише, светлее, безопаснее, с мирными улицами
  и знакомыми лицами. Или, может быть, это я сама была тогда другой — моложе и добрее,
  — а город всегда оставался таким, как сейчас.'
- 'Я не сразу поняла, что он имел в виду: его слова звучали обыденно, почти небрежно.
  А когда смысл до меня дошёл, мне захотелось убежать, спрятаться, но ноги будто приросли
  к полу, и я только смотрела на него, не в силах вымолвить ни слова.'
- 'Я сидела у камина, сжимая в ладонях тёплую чашку, и слушала, как за окном стучит
  по подоконнику дождь. В такие ночи прошлое возвращалось ко мне без стука: оно просто
  садилось рядом и начинало говорить голосами тех, кого уже нет.'
- 'Я боялась не смерти, не боли и не темноты, а того, что всё, что я любила, исчезнет
  вместе со мной: лица, голоса, маленькие радости. И никто этого не заметит, мир просто
  пойдёт дальше, будто меня и не было.'
- Я обещала себе не плакать, держалась из последних сил, глотала горький комок. Но
  когда дверь закрылась за ним и в комнате стало тихо, я почувствовала, как слёзы
  сами катятся по щекам, и не стала их вытирать.
instruct_ru: Женский, 25-35 лет, рассказчица, женственная фигура, мягкие нежные черты
  лица, тёплое открытое выражение, длинные ниспадающие волосы, расслабленная уравновешенная
  осанка, неторопливые грациозные движения
who_codes:
- narrator
