name: Enya
gender: F
age: 18-25
who: Персонаж определён в коде, но в script.rpy не найдено ни одной её реплики — только
  имя в переводах UI-строк. Данных о роли нет (мало данных).
instruct_en: Female, 18-25 years old, village girl, slender with a plain friendly
  face, long braided hair, brisk light movements, cheerful open stride
texts:
- 'Я выросла в этой деревне и знаю здесь каждого: кто честен, кто хитрит, у кого корова
  отелилась, а у кого сын сбежал в город, — деревенские новости расходятся быстрее
  ветра.'
- Я пошла на рынок ещё до рассвета, чтобы успеть выбрать лучшие овощи, и переторговала
  целых двух торговцев, так что мама осталась довольна, а это, поверь, дорогого стоит.
- Я мечтаю когда-нибудь увидеть большой город с его башнями и шумом, но пока слушаю
  рассказы проезжих купцов и собираю их истории, как другие собирают монеты.
- 'Зимой в деревне тихо, и мы собираемся у очага: я пою старые песни, которые пела
  ещё моя бабушка, и глядя на огонь, кажется, что время остановилось ради нас.'
- 'Я не боюсь работы: сенокос, стирка, огород — всё это мне по плечу, и руки у меня
  не белоручки, а как раз такие, что любое дело ладится, если взяться за него с охотой.'
instruct_ru: Женский, 18-25 лет, деревенская девушка, стройная, простое приветливое
  лицо, длинные заплетённые в косу волосы, проворные лёгкие движения, бодрая открытая
  походка
