name: Lily
gender: F
age: 18-25
who: 'Юная дворянка из рода Хайфилд: родня-предатели сбежала, оставив её и братьев/сестёр
  в столице под судом. Является к трону с клятвой верности, предлагает жизнь за милость
  к родным, становится рыцарем-вассалом Сары. 274 реплики.

  Характер: гордая, прямая, дерзкая — не стесняется хамить совету («тупой шпионмейстер»),
  с горькой иронией говорит о бросившей их родне. Искренняя, верная слову: клятву
  держит чего бы это ни стоило.

  Отношения: Сара — королева, которой присягает; родня — предатели, о которых говорит
  без сантиментов.

  Стиль речи: резкая, эмоциональная, с ругательствами и пафосными клятвами («I swear
  on everything in heaven...»), обращения «Princess Sarah».'
instruct_en: Female, 18-25 years old, noblewoman, tall slender noble bearing, fair
  hair, sharp proud features, upright martial posture, firm stride
texts:
- Что твой тупой шпионмейстер пытается тебе сказать — что мы не Хайфилды? Пусть сначала
  посмотрит на герб на моём щите и на шрамы, которые этот герб заслужил в бою, а потом
  болтает.
- Я пошла к трону, потому что это мой долг, и я не позволю ни страху, ни сплетням
  остановить меня. Долг перед семьёй и короной я ставлю выше собственного покоя, чего
  бы это ни стоило.
- Я делала то, что считала правильным, и не жалею ни о чём. Пусть другие шепчутся
  за моей спиной — я научена держать спину прямо и меч наготове, а это дороже доброй
  молвы.
- Думаешь, моим тупым грёбаным племянникам есть дело до меня? Они и о собственном
  имени вспоминают только когда нужно подписать чек или оспорить завещание, так что
  на их заботу я не рассчитываю.
- Я принесла клятву, и я сдержу её, чего бы это ни стоило. Меня учили, что слово дворянки
  стоит дороже золота, а клятва, данная у алтаря, тяжелее любой короны.
