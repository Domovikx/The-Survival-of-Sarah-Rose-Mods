name: Krip
gender: M
age: 25-40
who: Молчаливый здоровяк-моряк, машет топором (SailorArc). 2 реплик.
instruct_en: Male, 25-40 years old, sailor, huge broad-shouldered build, thick bull
  neck, massive hands, shaggy unkempt hair, lumbering heavy gait
texts:
- Дрова? Где? Я сложил их у западной стены, ровной поленницей, на два вечера, и если
  их кто-то утащил, мне придётся найти этого человека, потому что я не люблю, когда
  трогают то, что я заготовил.
- Костёр? Я его разложил ещё затемно, пока остальные спали, и поддерживал огонь до
  самого утра, потому что в такую сырую ночь без костра не выжил бы и зверь, не то
  что человек.
- 'Я пошёл за дровами в северную рощу — там сушняк лучше, чем у берега. Вернусь через
  час, не жди раньше: в темноте я хожу тихо, но медленно, зато принесу столько, что
  хватит на всю ночь.'
- 'Я делал то, что было нужно, и не спрашивай меня о подробностях: я не болтлив и
  не люблю пересказывать, что делал, куда ходил и с кем говорил, — море научило меня
  держать язык за зубами.'
- 'Море учит молчать, и я научился этому за долгие годы, проведённые на воде: волна
  не слушает лишних слов, поэтому и я говорю только тогда, когда слова нужны, и не
  раньше.'
arcs:
