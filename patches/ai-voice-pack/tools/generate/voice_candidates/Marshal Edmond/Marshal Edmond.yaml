name: Marshal Edmond
gender: M
age: 40-60
who: 'Маршал Розанны, участник Совета Союза в арке UnionKingdom. Худой, аскетичный,
  презирает разврат дворянства и цинично рассуждает о продажности бедных. В конце
  арки становится верховным королём Союза, грубо подчиняя герцога Антонио.

  Характер: Холодный, саркастичный, безжалостно прямой. Не любит игры теней, но как
  политик жёсток и расчётлив: унижает Антонио, угрожает и обещает «милосердное» правление.

  Отношения: Сара — собеседник на совете, к которой снисходителен, обменивается разведданными;
  герцог Антонио — главный политический противник; правители Союзных Королевств —
  под его давлением.

  Стиль речи: Сдержанная, язвительная, афористичная речь; официальные формулировки
  сменяются едкими колкостями и скрытыми угрозами.'
instruct_en: Male, 40-60 years old, marshal, lean and ascetic, gaunt weathered face
  with deep creases, grey cropped hair, ramrod military posture, brisk economical
  gait, sinewy hands
texts:
- Я командовал войсками в десятках сражений и ни разу не терял головы даже в самой
  отчаянной ситуации. Паника — это роскошь, которую солдат может позволить себе только
  один раз, и я видел, чем это кончается.
- Я делал замечания по поводу твоей подготовки, потому что настоящий солдат должен
  быть готов к любым испытаниям и не жалеть себя. Не потому, что я злой старик, а
  потому что враг не будет делать скидок на твою усталость.
- Я сегодня утром провёл инспекцию лагеря и остался доволен состоянием снаряжения
  и дисциплины. Впервые за месяц, кстати. Надеюсь, ты не думаешь, что похвала — это
  повод расслабиться, потому что завтра я проверю всё снова.
- Мы с тобой прошли через немало трудностей, и я надеюсь, что ты наконец научилась
  держать себя в руках. Война не прощает истерик, и я не собираюсь подтирать последствия
  твоих порывов.
- Я всегда говорил то, что думал, даже если это звучало грубо, потому что на войне
  вежливость стоит дорого, а иногда и жизни. Если я молчу — значит, ты всё делаешь
  правильно, и это лучшее, что я могу сказать.
arcs:
- UnionKingdom
instruct_ru: Мужской, 40-60 лет, маршал, худой и аскетичный, обветренное лицо с глубокими
  морщинами, седые коротко стриженные волосы, струнная военная осанка, стремительная
  экономная поступь, жилистые руки
