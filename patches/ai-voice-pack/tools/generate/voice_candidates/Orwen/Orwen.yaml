name: Orwen
gender: M
age: 8-14
who: 'Маленький сын Сары и Варги в эпилоге (UnionKingdom): принц, играет в прятки
  с сестрой Мириам, обещает матери беречь сестру, пока она едет к королеве Мэйв.

  Характер: Живой, озорной, отважный малыш: спорит с матерью, храбрится, что не боится
  василиска, воюет с отцом в шутку. Трогательный и смешной ребёнок.

  Отношения: С матерью Сарой — обожание и мелкие споры; с сестрой Мириам — дразнятся
  и дерутся; с отцом Варгой — возня и борьба.

  Стиль речи: Детская речь с восклицаниями: «No fair!», «But mom, we''re not tired,
  really!», «I promise!», «No mercy for a basilisk!».'
instruct_en: Male child, 8-14 years old, child, small and slight with a round boyish
  face, scrawny limbs, quick scampering movements, fidgety posture
texts:
- Нечестно! Так нечестно, вы же сами сказали, что я могу играть, а теперь делаете
  вид, что я виноват! Я всё слышал и видел своими глазами, и я хочу, чтобы все знали
  правду, а не только то, что говорят взрослые!
- Я был тихим! Честно-честно, я не шумел, я даже дышал через раз, как меня учил дядя.
  Это не я, это, наверное, кто-то другой, а на меня просто решили свалить! Ну почему,
  когда что-то случается, все сразу смотрят на меня?
- Я пошёл посмотреть, что там за шум, потому что услышал что-то очень громкое и странное.
  Оказалось, интересно! Там было на что посмотреть, я даже не заметил, как стемнело,
  но я не виноват, что это было так увлекательно!
- Я делал то, что хотели, и даже не спорил, как меня учили! Я не виноват, что всё
  получилось не так, как задумывалось. Я старался, правда старался, просто взрослые
  иногда говорят одно, а потом оказывается, что нужно было делать другое.
- Я знаю секрет, но не скажу! Меня учили, что секреты нужно беречь, как самое дорогое,
  и я берегу. Даже если меня будут очень просить и давать вкусности, я не расскажу,
  пока не придёт время. Вот увидишь, я умею молчать!
