name: Synara
gender: F
age: 25-35
who: 'Заключённая в тюрьме (PrisonPath2), главарь банды девушек; по словам Юлы — «проблема»:
  села за кражу, но точно убила минимум троих, любит «прощупывать» новеньких.

  Характер: Мало данных: не произносит ни одной реплики; характеризуется только через
  Юлу как опасная, агрессивная авторитетная фигура.

  Отношения: Держит группу подручных, враждебна к новым заключённым.

  Стиль речи: Мало данных: реплик нет.'
instruct_en: Female, 25-35 years old, prison gang leader, tough stocky build with
  broad shoulders, hard angular face with a cold stare, cropped unruly hair, heavy
  swaggering gait
texts:
- 'Новая, значит? Тогда слушай сюда, и слушай внимательно: здесь мои правила, мои
  люди и мой порядок, и тот, кто их не признаёт, долго в этом блоке не задерживается
  — это я обещаю.'
- 'Меня не интересует, за что тебя посадили: здесь все в чём-то виноваты, даже те,
  кто строит из себя святых. Ты выживешь, если будешь умной, и не выживешь, если будешь
  умничать.'
- 'Я села за кражу, но в этом городе это лишь формальность: настоящая причина в том,
  что я умею брать своё, а это многим не нравится. Здесь, в тюрьме, за это либо уважают,
  либо убивают.'
- 'Девчонки из моей банды знают, что я их прикрою, но и плату беру: послушание. Пока
  ты с ними — ты под моей защитой, и никто тебя не тронет, а попробуешь предать —
  пожалеешь.'
- 'Надзиратели думают, что тюрьма — это их власть, но они лишь гости в моём доме:
  я знаю каждый угол, каждую трещину и каждого, кто смотрит не туда, и терпение у
  меня бездонное.'
