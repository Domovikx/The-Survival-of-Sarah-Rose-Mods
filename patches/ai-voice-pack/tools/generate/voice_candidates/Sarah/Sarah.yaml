name: Sarah
gender: F
age: 17-19
who: 'Принцесса Розанны, дочь короля Орвелла Роуза и старшая сестра наследника Томаса.
  Проходит путь от юной принцессы через политические интриги, смерть отца, гражданские
  войны, службу в отряде наёмников, плен у орков и обучение магии до пленницы демона.

  Характер: Уверенная, дерзкая и сообразительная: торгуется с отцом, мягко управляет
  братом, не боится спорить с советом. Эмоциональный диапазон огромен: забота и нежность
  к семье, гнев и брань, отчаянный страх в плену, сломленность в DemonArc. Боевая
  и стойкая, но в жестоких обстоятельствах сдаётся.

  Отношения: С братом Томасом — старшая сестра-наставница, с отцом — любящая дочь,
  с Варгой и Самайрой — романтические линии, с демоном и орком — жертва/пленница,
  с Кассиусом и Далией — союзники в неволе.

  Стиль речи: Речь тёплая и бытовая с близкими, официально-дипломатичная при дворе,
  с острыми репликами и самоиронией; в плену — сломленная, сбивчивая.'
instruct_en: Female, 17-19 years old, princess, slender with graceful bearing, fair
  hair, composed upright posture, delicate noble hands
texts:
- Отец говорил, что корона всегда тяжелее, чем кажется, и что золото весит больше,
  когда его носит живой человек. Теперь, когда этот вес лежит на моих плечах, я наконец
  понимаю, что он имел в виду.
- Совет может сколько угодно спорить о моей неопытности и качать седыми головами,
  но решение уже принято, и оно будет исполнено. Я выслушала все доводы, взвесила
  их, и теперь моё слово — закон, нравится это кому-то или нет.
- Иногда я скучаю по тем вечерам, когда мы сидели у камина, отец читал вслух, а весь
  мир казался простым и понятным, как детская сказка. Теперь в этой сказке пишут новую
  главу, и её пишу я.
- Ты правда думал, что я не замечу слежку? Мне дважды шепнули, что за мной ходит хвост,
  и оба раза — разные люди, которые друг друга не знают. Учись подбирать помощников
  тщательнее, а не то все твои тайны станут городскими сплетнями.
- Я не прошу у тебя ничего, кроме правды, — ни верности, ни услуг, ни красивых слов.
  Если ты не можешь дать мне её, значит, нам не по пути, и я предпочту идти одна,
  чем слушать, как мне лгут.
