name: Bran
gender: M
age: 25-35
who: Персонаж определён в script.rpy, но ни одной реплики в файле найдено не было
  — мало данных, в сценах не появляется.
instruct_en: Male, 25-35 years old, castle guard, sturdy soldier's build, square honest
  face, short-cropped hair, disciplined posture, measured heavy tread
texts:
- 'Я несу службу у этих ворот уже много лет, и за это время научился отличать честного
  путника от того, кто затевает недоброе: глаза говорят больше, чем слова, а моя рука
  на рукояти не дрогнет.'
- 'Мне платят за то, чтобы я стоял здесь и смотрел в оба, и я делаю своё дело без
  лишних слов: кого положено — пропущу, кого положено — остановлю, а остальное пусть
  решает тот, кто выше меня.'
- 'Я слышал немало историй о том, что творится за этими стенами, но мой долг — не
  слухи собирать, а стоять на посту: каждый, кто входит и выходит, проходит через
  мои глаза, и это я запоминаю.'
- 'Зимой эта служба тяжела, но я не жалуюсь: я видел, как люди теряют место из-за
  болтливости, поэтому держу язык за зубами и делаю, что велено, — так спокойнее и
  надёжнее.'
- 'Если ищешь кого-то в замке, говори прямо: я знаю, кто когда приходит и уходит,
  и помогу, если это не против моей присяги, — а уж против присяги я не пойду ни за
  какие деньги.'
instruct_ru: Мужской, 25-35 лет, замковый стражник, крепкое солдатское телосложение,
  открытое простое лицо, коротко стриженные волосы, дисциплинированная осанка, размеренная
  тяжёлая поступь
