name: Kamal
gender: M
age: 40-55
who: 'Губернатор провинции Розайи (бывшей Розанны), назначенный ханом после вторжения.
  В WarriorPath: во флешбеке получает титул из рук хана, а в финале — захвачен в тронном
  зале и казнён Сарой за вторжение и гибель её брата.

  Характер: Тучный, сладкоречивый льстец. При встрече с Сарой — дрожащий от страха
  трус, умоляет о пощаде, лебезит, предлагает уйти в пустыню и славить её милосердие;
  в конце — визжит и молит о жизни.

  Отношения: С ханом — верноподданный генерал, получающий награды; с Сарой — палач
  и жертва: она помнит его грязные речи о себе и безжалостно его казнит.

  Стиль речи: Витиеватая лесть и церемонные обороты; в панике — обрывочные мольбы
  и крики.'
instruct_en: Male, 40-55 years old, governor, heavy corpulent build, round fleshy
  face with soft jowls, damp sweaty hands, shuffling gait
texts:
- Великий хан, ты оказываешь мне великую честь своим доверием, и я клянусь, что оправдаю
  его до последнего вздоха. Моя жизнь принадлежит тебе, мой меч — твоему знамени,
  и я не посрамлю звания, которое ты мне даровал.
- Я вёл кампанию тридцать лет и не проиграл ни одного сражения, потому что каждый
  свой шаг я просчитывал заранее, как шахматист, а каждый приказ взвешивал на весах
  опыта. Победа — это не удача, это дисциплина.
- Я пошёл на этот шаг не по своей воле и не по собственному разумению, а потому что
  так велел великий хан. Приказ для солдата — закон, и я исполняю его без колебаний,
  даже если он стоит мне жизни.
- Я делал то, что нужно было для победы, и пусть методы не всегда были красивыми,
  они были верными. На войне проигрывает тот, кто колеблется, а я привык доводить
  дело до конца, не оглядываясь назад.
- Мой меч служит хану, и моё сердце бьётся в такт его воле. Я положил на алтарь его
  службы молодость, кровь и сны, и если он прикажет умереть — умру, не спрашивая зачем,
  потому что верность — моя честь.
