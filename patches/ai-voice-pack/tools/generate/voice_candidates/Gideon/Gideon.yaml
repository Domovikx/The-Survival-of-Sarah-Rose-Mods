name: Gideon
gender: M
age: 30-45
who: 'Один из командиров наёмной роты Вейлена: управляет ядром армии, пока Сара ведёт
  авангард. Участвует в военных советах, командует высадкой у побережья в походе на
  племена.

  Характер: Непринуждённый, с постоянной улыбкой, говорит с Сарой на равных. Прагматик
  с чёрным юмором: честно называет поход в пустыню самоубийственным и предлагает подсунуть
  Вейлену «плохой план», лишь бы тот отменил марш. Иногда рефлексирует об одиночестве
  и зовёт Сару выпить.

  Отношения: Вейлен — начальник, которому верен, но которого пытается образумить;
  Сара — соратница и собутыльник.

  Стиль речи: Казарменный, расслабленный тон, без титулов; прямая оценка ситуации.'
instruct_en: Male, 30-45 years old, mercenary commander, stocky battle-hardened frame,
  scarred weathered face, cropped hair, commanding upright posture, swaggering gait
texts:
- 'У тебя отвратительное настроение, я вижу это сразу, с первого взгляда. Двадцать
  лет командовал отрядом, где каждый второй умел прятать лицо, так что меня не проведёшь:
  хмуришься — значит, что-то не так.'
- Я командовал отрядом двадцать лет, и за это время научился читать людей по глазам,
  по голосу, по тому, как они держат оружие. От меня не ускользнёт ни ложь, ни страх,
  ни предательство, запомни это.
- 'Я пошёл на эту войну не за славу и не за почести, их наёмникам не дают, это я усвоил
  давно. Деньги — другое дело: за них я дерусь честно и до конца, а за красивые слова
  и медали пусть воюют благородные дураки.'
- 'Я делал то, что нужно было для дела: не больше и не меньше, без лишних вопросов
  и сантиментов. Такой уж я человек, и отряд мой служит мне потому, что знает: приказ
  будет точным, а плата — честной.'
- 'Ты хмуришься, а это значит, что ты думаешь, а значит — опасен. Я таких уже встречал:
  молчаливые всегда опаснее крикунов, и с ними я держу ухо востро, пока не пойму,
  что у них на уме.'
arcs:
