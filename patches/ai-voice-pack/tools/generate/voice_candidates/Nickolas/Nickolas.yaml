name: Nickolas
gender: M
age: 20-30
who: 'Матрос на корабле капитана Белмонта, волею судьбы напарник Сары: учит её морскому
  делу, переживает с ней кораблекрушение и выживание в горах Хирала; конфликтует с
  жестоким капитаном, бунтует и уходит с Сарой.

  Характер: Легкомысленный, добродушный и живучий: сирота из Летрама, сбежал в 13
  лет, годами дрейфует от порта к порту. Разговорчив и любопытен, умеет сглаживать
  углы, но упрям и горд, когда дело касается унижений капитана. Верен Саре, способен
  на отчаянные решения.

  Отношения: Сара — судовой товарищ и предмет симпатии (флиртует, ревнует к капитану,
  вместе выживают после крушения); капитан Белмонт — деспотичный наниматель, против
  которого зреет бунт.

  Стиль речи: Матросский сленг: «ain''t», «gotta», «fuckin''», жаргон морского дела,
  шутки-подколы, простые житейские истории.'
instruct_en: Male, 20-30 years old, sailor, lean sun-bronzed sailor, weathered face
  with bright lively eyes, tousled dark hair, agile rolling gait of a seaman, quick
  wiry movements, rope-scarred hands
texts:
- Я соберу немного дров, пока вы тут отдыхаете, — я знаю одно местечко, где сушняка
  полно, и если потороплюсь, то вернусь ещё до того, как вы успеете соскучиться по
  моим рассказам!
- 'Взял их из пещеры, что за северным склоном: там валялась целая куча разного полезного
  добра, и я подумал, что всё это может пригодиться, — вдруг пригодится, а выбросить
  всегда успеем!'
- Я пошёл на корабль не ради славы и не ради денег, а потому, что море зовёт меня
  — я с детства слушал его шум в ракушке и мечтал о дне, когда сам подниму парус и
  уйду за горизонт.
- 'Я делал то, что нужно, — таскал, носил, греб и дежурил, — и не жалуюсь, потому
  что так меня учили: сначала дело, потом слова, а на болтовню всегда успеется, тем
  более на корабле без этого никак.'
- 'Море учит терпению, и я учился этому долго: сперва злился, когда рыба не шла, потом
  понял, что у моря свои сроки, и теперь просто жду, когда оно само всё расставит
  по местам.'
