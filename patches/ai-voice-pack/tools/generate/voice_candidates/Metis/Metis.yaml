name: Metis
gender: M
age: 30-60
who: 'Маг Ордена, бывший ученик Ксана, которого он ищет в его доме в арке BlackMonolith.
  Становится учителем Сары по магической ботанике и инфузии; в конце оставляет ей
  письмо о магической аномалии в древнем городе Варань.

  Характер: Обходительный, лисоподобный, с лёгкой иронией. Умудрённый странник Ордена,
  уставший от дорог, любит уют у огня. Умело уходит от прямых ответов, но как наставник
  терпелив и методичен.

  Отношения: Ксан — наставник, которого разыскивает; Сара — новая ученица/хозяйка
  дома; Самайра — с ней любезен; Орден — коллеги-сплетники.

  Стиль речи: Вежливая, витиеватая речь старой школы с междометиями-восклицаниями,
  мягкие намёки вместо прямых вопросов; в преподавании — чёткие объяснения и практический
  подход.'
instruct_en: Male, 30-60 years old, wandering mage, lean wiry frame with a slight
  wanderer's stoop, sharp fox-like features with narrow eyes, silver-streaked hair,
  light quick movements, long nimble fingers
texts:
- Я путешествовал по самым далёким землям — от ледяных пустошей до песчаных империй,
  — и видел столько чудес, что мне порой кажется, будто я прожил несколько жизней
  одновременно, а не одну долгую и богатую на приключения.
- 'Я делал открытия, которые шокировали даже самых опытных магов моего времени, но
  при этом никогда не прятал свои знания за семью печатями: я всегда делился ими с
  теми, кто был готов учиться, слушать и спорить со мной.'
- Я сегодня утром, знаешь ли, размышлял о природе магии за чашкой травяного отвара
  и снова пришёл к выводу, что ключ ко всем её тайнам скрывается в самых простых вещах,
  которые мы обычно игнорируем в погоне за чудесами.
- Мы с тобой обсуждали этот вопрос с самого утра, и, признаться, я рад, что ты наконец
  начала улавливать глубину моих рассуждений о мире и его устройстве, — поверь, немногие
  собеседники выдерживают мои лекции дольше получаса.
- 'Я всегда относился к жизни с доброй долей юмора и упрямого оптимизма, потому что
  даже в самые тёмные времена стоит находить поводы для улыбки: смех, как и магия,
  действует лучше, когда вокруг всё рушится.'
arcs:
- BlackMonolith
instruct_ru: Мужской, 30-60 лет, маг-странник, жилистая сухощавая фигура с лёгкой
  сутулостью странника, острые лисьи черты с узкими глазами, волосы с серебристой
  проседью, лёгкие быстрые движения, длинные проворные пальцы
who_codes:
- met
