name: Hugh
gender: M
age: 25-40
who: 'Хью — теневой делец: сдаёт «тихую» комнату беглецам Аларику и Саре, скупает
  краденое, торгует наркотиком «dreamstalk» и сдаёт помещения проституткам; осведомитель
  криминального мира.

  Характер: Прагматичный, жадный, циничный; добродушен ровно настолько, насколько
  платят. С должниками и «отрабатывающими» груб и жесток, но если получил своё — предупреждает
  об опасности и даже приносит новости.

  Отношения: С Алариком — «друг» по криминалу с вечными претензиями по деньгам; с
  Сарой — хозяин-вымогатель; со стражами — купленные связи.

  Стиль речи: Просторечие с матом, короткие деловые фразы о деньгах, услугах и рисках.'
instruct_en: Male, 25-40 years old, shady dealer, lean wiry frame, thin sharp-featured
  face with narrow shrewd eyes, slicked-back hair, quick darting movements, restless
  hands
texts:
- 'Можешь льстить сколько угодно, Аларик, но учти: меня не продешевишь, я за свои
  годы повидал всяких говорливых хитрецов. Слаще мёда речь у того, кто хочет урвать
  товар подешевле, а я цену знаю заранее.'
- 'Я пошёл на эту сделку не ради дружбы и не ради добрых слов, а потому что вижу в
  ней выгоду для обеих сторон. Я торговец, а торговец без выгоды — что корабль без
  ветра: никуда не поплывёт, так что давай ближе к делу.'
- 'Я делал деньги в каждом королевстве, где ступала моя нога, и знаю толк в прибыли
  лучше любого придворного казначея. Меня не обмануть цифрами: я чую выгоду так, как
  собака чует дичь.'
- 'Плати или ищи другого дурака, который рискнёт петлёй ради тебя. Я рискую своим
  именем и шеей не за спасибо: у меня семья, долги и деловые обязательства, так что
  цену я называю один раз.'
- Мои глаза видят золото там, где другие видят мусор и пыль. Этот хлам на прилавке
  у соседа — целое состояние в руках того, кто умеет смотреть, и за годы торговли
  я научился видеть цену в любой мелочи.
