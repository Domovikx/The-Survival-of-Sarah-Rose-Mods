name: Captain Belmont
gender: M
age: 40-50
who: 'Капитан корабля, на котором Сара плывёт из Розанны в Летрам. Шантажирует пассажирок
  неоплаченной частью пути, превращая долг в сексуальную кабалу, позже нанимает Сару
  матросом в SailorPath и появляется в финале при падении Летрама, унижая её.

  Характер: Грубый, циничный, похотливый морской волк: торгуется за плату, развлекается
  унижением и властью над беспомощными. Амбивалентен: в SailorPath берёт Сару на борт
  с издевательской снисходительностью, в финале срывается на жестокость и насилие.

  Отношения: Сара и её подруга — жертвы его долговой ловушки; обращается «blondie»,
  считает её своей собственностью после сделки.

  Стиль речи: Просторечный, морской жаргон: «draw up the anchor», «rigged the sails»,
  грубые приказы, сальные намёки, насмешливые обращения «Blondie», «come on now».'
instruct_en: Male, 50-60 years old, hardened sea captain who has spent decades on
  the waves, barrel-chested and stocky, thick leathery skin burned dark by sun and
  salt spray, tangled grey beard, bushy brows over eyes permanently squinting at the
  horizon, scarred knuckles, always swaying slightly as if the deck never left his
  legs, gruff commanding presence used to giving orders
texts:
- 'Я думал, это ты, но до конца уверен не был. Море меняет людей, знаешь ли: оно добавляет
  и соли в кровь, и седины в бороду, и молчания в душу. Годы в плавании — они как
  десять жизней, прожитых в одной.'
- 'Надо сказать, Блонди, из тебя вышла бы славная моря́чка. Редко кто так держится
  на палубе в первый шторм: половина новичков блюёт за борт и молится, а ты стояла
  у руля, будто родилась среди волн.'
- 'Держись за планшир, девочка. Шторм — не время для сантиментов: сначала удержим
  корабль на волне, спасём груз и головы, а уж чувства свои прибереги до тихой гавани,
  когда можно будет спокойно выпить.'
arcs:
- Other
- SailorPath
- MagePath
instruct_ru: Мужской, 50-60 лет, прожжённый морской капитан, десятилетия в море, бочкообразная
  грудь, коренастый, кожа толстая как старая кожа, загорелая от солнца и солёных брызг,
  спутанная седая борода, густые брови над вечно прищуренными глазами, шрамы на костяшках,
  слегка покачивается, будто палуба не покидала его ног, грубая командная манера
