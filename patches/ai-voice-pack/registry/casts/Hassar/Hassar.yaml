name: Hassar
gender: M
age: 35-45
who: 'Хан орды Пустыни Майяни, завоеватель Розанны; держит бывшую принцессу Сару при
  своём дворе, испытывает её магическим кольцом на честность и решает её судьбу: святилище
  или аукцион рабов.

  Характер: Имперски-надменный и философичный правитель: презирает титулы и традиции,
  ценит силу, честность и лояльность. Способен на тёплые жесты (прогулки по саду,
  дары) и тут же — на ледяную жестокость. Говорит притчами и мудростями, самоироничен.

  Отношения: Сара — завоеватель и рабыня, которую он испытывает и награждает за правду;
  Джаейд — верный эмиссар; военачальник Камал — новый наместник.

  Стиль речи: Формально-величавый тон, обращения «Princess Sarah Rose», лекции о природе
  власти, спокойные угрозы, старомодный пафос.'
instruct_en: Male, 35-45 years old, khan and conqueror, tall and broad-shouldered
  with a powerful desert-hardened build, weathered tanned face with strong features,
  dark hair and beard, imperial upright posture, slow predatory stride
texts:
- Я зашёл убедиться, что тебя хорошо приняли, но вижу, мои девушки уже устроили тебя
  лучше, чем я мог ожидать. Похвально, когда гостья так быстро находит общий язык
  с моим народом.
- Я правил племенами много лет и собрал множество сокровищ, но тебя не купить ни золотом,
  ни подарками, и это тревожит меня сильнее, чем любая война. Такие люди либо становятся
  союзниками, либо исчезают.
- 'Ты смелая, раз смотришь мне в глаза, и это хорошо. Смелость мне по душе, а трусы
  в моём шатре не задерживаются и дня. Но помни: смелость и дерзость — разные вещи,
  и грань между ними я умею показывать.'
