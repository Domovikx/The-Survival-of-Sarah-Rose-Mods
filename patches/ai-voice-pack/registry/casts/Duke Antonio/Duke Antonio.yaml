instruct_ru: Мужской, 40-60 лет, герцог, грузный и откормленный, с солидным брюшком,
  румяное лицо с лукавой ухмылкой, напомаженные тёмные волосы, развязная тяжёлая походка
  балованного жизнью человека, кольца на пухлых пальцах
