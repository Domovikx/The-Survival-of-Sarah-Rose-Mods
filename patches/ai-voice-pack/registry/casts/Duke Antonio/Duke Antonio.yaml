name: Duke Antonio
gender: M
age: 40-60
who: 'Герцог Антонио из Медини — правитель торговой нации, участник Союзного совета;
  «незамысловатый человек, наслаждающийся жизнью: богатством и женщинами»; торгует
  поддержкой за услуги и секс.

  Характер: Гедонист и циник, по-южному эмоциональный; пошловат, хвастлив, цинично-развязен,
  но при отпоре быстро отступает и просит прощения. За фасадом — делец, считающий
  выгоду.

  Отношения: С Сарой — двусмысленно-наглый: льстит, пристаёт, использует её положение;
  с Эдмондом — дружеские похотливые разговоры о женщинах; с Мейв — союзник-соперник
  по совету.

  Стиль речи: Развязный, фамильярный, с божбой и пошлыми метафорами; легко переключается
  с грубости на лесть.'
instruct_en: Male, 40-60 years old, duke, portly and well-fed with a prosperous paunch,
  florid face with a jovial sneer, oiled dark hair, swaggering heavy gait of a man
  used to indulgence, rings on plump fingers
texts:
- Я принял это решение после долгих размышлений и обсуждений с советом, и я уверен,
  что это лучший путь для нашего королевства, даже если некоторые мои подданные ещё
  не готовы это признать.
- Я делал всё возможное, чтобы поддерживать порядок и стабильность в моих землях,
  даже когда обстоятельства складывались против меня, потому что герцог обязан стоять
  твёрдо, когда всё вокруг шатается.
- Я сегодня утром провёл заседание совета, на котором мы обсудили текущую ситуацию
  и наметили план действий на ближайшие месяцы, и я настоял на том, чтобы каждое слово
  было записано и каждый голос услышан.
- Мы с вами обсуждали этот вопрос неоднократно, и я надеюсь, что на этот раз вы примете
  разумное решение, основанное на фактах, а не на эмоциях, которые столь часто затуманивают
  суждения молодых людей.
- Я всегда старался быть справедливым и честным в своих решениях, потому что настоящий
  лидер должен служить примером для своих подданных, даже когда справедливость обходится
  ему дорого.
