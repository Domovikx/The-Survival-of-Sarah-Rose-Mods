instruct_ru: Мужской, 55-70 лет, старый генерал, высокий и широкоплечий, массивное
  внушительное телосложение, обветренное морщинистое лицо с глубокими складками, седые
  волосы и густые седые брови, струнная военная осанка, медленная тяжёлая поступь
