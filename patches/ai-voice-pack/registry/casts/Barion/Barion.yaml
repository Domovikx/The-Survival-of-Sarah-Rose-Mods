name: Barion
gender: M
age: 55-70
who: 'Высокий генерал (High General) королевства Розанна, член совета при короле и
  Томасе. В ветке NeitherPath объявляет Сару арестованной по подозрению в измене от
  имени Розаннского временного комитета (участник переворота).

  Характер: Военный до мозга костей: подозрителен, мыслит категориями угроз, настаивает
  на опасности Хассара вопреки доводам шпионмейстера. В сцене ареста — официально-холодный
  исполнитель, не грубый, но безжалостный.

  Отношения: С Сарой — верный подданный в совете, затем исполнитель её ареста; с Томасом
  — военный советник; с Кравелом — соперник в оценке угроз.

  Стиль речи: Служебная, официальная речь с военными терминами, доклады об укреплениях
  и состоянии стен, строгие обращения по титулам.'
instruct_en: Male, 55-70 years old, old general, tall and broad-shouldered with a
  heavy imposing build, weathered wrinkled face with deep furrows, grizzled grey hair
  and thick grey eyebrows, ramrod military posture, slow heavy gait
texts:
- Я служил этой короне сорок лет и не намерен прекращать. Пока моя рука держит меч,
  а голова — ясность, я буду стоять там, где велел мне долг, сколько бы седин это
  ни стоило.
- Король Томас, прошу прощения, но как верховный генерал я полагаю, что это ошибка.
  Я видел слишком много войн, чтобы знать цену поспешных решений, и обязан высказать
  своё мнение, даже если оно придётся не по вкусу.
- Я делал свой долг, когда ты ещё молоком пах, мальчик. Не поучай меня, как воевать.
  Сорок лет крови, пота и слёз дают право говорить напрямую, без оглядки на титулы
  и возраст.
- Мой меч уже посерёк от крови за эти годы, но я ещё стою на ногах. Королевства падали
  и поднимались на моих глазах, и каждая битва оставляла свой след в моей памяти и
  на лезвии.
- Я видел падение королевств и рождение империй, и всё это мимолётно, как песок меж
  пальцев. Остаются только люди, которым ты служил, и слово, которое ты держал до
  самого конца.
