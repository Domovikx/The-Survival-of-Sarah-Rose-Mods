name: Kate
gender: F
age: 18-22
who: 'Подруга детства Сары из замка Розанны. Сбежала из дома ночью, спасаясь от навязанного
  брака со старым богачом, годы скиталась, пока Вейлен не завербовал её в наёмную
  роту «Братья Провидения». Вернулась к Саре по поручению её покойного отца, чтобы
  вывезти её в Летрам, и стала её наставницей в бою.

  Характер: Дерзкая, насмешливая, с живым чувством юмора: подкалывает Сару («princess»,
  «Your Royalty»), флиртует и открыто признаётся в чувствах. Резкая и прямая. В MagePath
  превращается в горького врага, обвиняющего Сару в смерти Калеба и Эфраима, а в HollowWorld
  — спившийся, сломленный алкоголик.

  Отношения: Сара — от близкой подруги и любовницы до врага и жалкого пьяницы; Вейлен
  — командир, которому поклялась служить; Калеб и Эфраим — погибшие товарищи.

  Стиль речи: Просторенная, лёгкая речь с ироничными обращениями к Саре; в состоянии
  падения — пьяная, сбивчивая брань.'
instruct_en: Female, 18-22 years old, mercenary, athletic and lean, sharp features,
  sun-browned skin, quick restless energy, calloused sword hands
texts:
- 'Слушай, Сара, если ты снова собралась тащить нас всех куда-то ради очередной благородной
  идеи, сначала хотя бы предупреди меня — я подготовлюсь: припрячу лишний клинок,
  найду нормальную обувь и, может, даже высплюсь заранее.'
- Терпеть не могу, когда кто-то решает за меня, что мне делать и куда идти, а особенно
  когда этот кто-то старше меня и уверен, что знает всё лучше — словно мой возраст
  делает меня пустым местом без права голоса.
- Помнишь, как мы с тобой сбегали из дворца через чёрную лестницу, пока стража обедала?
  Я до сих пор помню каждый твой взгляд в ту ночь — испуганный, но азартный, — и до
  сих пор улыбаюсь, когда о ней вспоминаю.
- 'Держи клинок ниже, дыши ровно и смотри противнику в глаза, а не на его руки. В
  бою паника убивает быстрее самой стали, уж я-то знаю по себе: однажды я чуть не
  умерла только потому, что задрожала.'
- Я вернулась не для того, чтобы просить прощения за своё исчезновение и выслушивать
  нотации, — я вернулась потому, что ты здесь, и ни одна причина в мире не удержала
  бы меня от того, чтобы быть рядом, когда ты во мне нуждаешься.
