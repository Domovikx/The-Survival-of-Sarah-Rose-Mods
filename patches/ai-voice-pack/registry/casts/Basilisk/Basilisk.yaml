name: Basilisk
gender: M
age: ageless
who: 'Строковый спикер — роль, которую играет Варга в домашней сказке о Сэре Родерике:
  рычит и нападает на рыцаря в постели детей (эпилог UnionKingdom1).

  Характер: Игровая роль: громогласный злобный зверь, воющий в детской игре. Мало
  данных — одна реплика.

  Отношения: С Сарой (Сэр Родерик) — антагонист сказки; с детьми — шутливый монстр.

  Стиль речи: Единственная реплика — громоподобный рык: ''WHO DARES ENTER MY DOMAIN?!?!''
  — низкий, мощный, театрально-злодейский.'
instruct_en: Male, ageless mythical beast, colossal scaled serpentine body, burning
  yellow eyes, massive fanged jaws, thunderous towering presence
texts:
- Кто посмел войти в мои владения?! Я, великий василиск, владыка этих подземелий,
  требую, чтобы ты назвал своё имя и приготовился к своей гибели, ибо никто не уходит
  отсюда живым!
- Я видел сотни рыцарей, что приходили сразить меня, и все они пали под моим взглядом!
  Мой яд разъедает сталь, а мои когти рвут щиты, так что дрожи, смертный, перед своей
  участью!
- Моё чешуйчатое тело обвивает эти залы уже тысячу лет, и я помню каждого, кто ступал
  сюда! Ты будешь ещё одной легендой, которую станут рассказывать у очагов, но тебя
  уже не будет!
- Я чувствую твой страх, и он сладок, как мёд! Подойди же ближе, храбрец, и я покажу
  тебе, почему даже орлы облетают мои пещеры стороной, а короли молят о пощаде!
- Сражён ли ты? Нет, ты лишь оглушён моим рёвом! Вставай, рыцарь, и сражайся достойно,
  ибо даже чудовище уважает тех, кто встречает свой конец с мечом в руках!
arcs:
- UnionKingdom1
