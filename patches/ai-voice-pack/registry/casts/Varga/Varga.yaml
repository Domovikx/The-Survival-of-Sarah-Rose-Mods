name: Varga
gender: M
age: 20-25
who: 'Варга Нортвуд — молодой военный гений из недавно облагороженной семьи (родом
  из северных лесов): в 16 лет командовал подавлением восстания в Северной Часовне.
  Входит в совет королевства, стратег осад и любовный интерес/муж Сары.

  Характер: Скромный и прямой: о своих подвигах говорит буднично, смущается при дворе,
  неуклюже пытается повторить реверанс принцессы. Галантный (отдаёт плащ), решительный
  и преданный — обнажает меч ради Сары при её аресте. Позже — спокойный, любящий супруг.

  Отношения: С Сарой — романтическая линия от знакомства на бастионе до брака; с Томасом
  — член совета; в осадах командует войсками ради спасения Томаса.

  Стиль речи: Говорит по делу, без пафоса, по-военному конкретно (планы осад: артиллерия,
  шпионы, слабые участки стен), при дворе — формальные вежливые обороты.'
instruct_en: Male, 20-25 years old, soldier, sturdy and broad-shouldered with a plain
  open face, strong soldier's hands, steady erect posture
texts:
- 'Я не люблю говорить о прошлом: оно осталось там, где ему и место, и пусть лежит,
  не тревожу его. Моя клятва тебе значит больше, чем любые воспоминания, и я прошу
  тебя судить обо мне по делам, а не по слухам о том, что было.'
- Ты пришла ко мне, значит, доверяешь мне, и этого мне вполне достаточно, поверь.
  Всё остальное — сомнения, чужие слова, шепотки за спиной — можно оставить за дверью,
  потому что между нами не должно быть лишнего.
- 'Я сказал, что защищу тебя, и я сдержу своё слово, как держал его всегда. Так было
  с тех пор, как я дал эту клятву, и так будет, пока я дышу: пока я стою на ногах,
  ни одна беда не коснётся тебя без моего ведома.'
- 'Не нужно лишних слов там, где всё и так ясно, я не мастер длинных речей. Просто
  будь рядом, и я справлюсь с чем угодно: с врагами, с дорогой, с любым испытанием,
  потому что одному воевать трудно, а вдвоём — легче.'
- Мой меч служит тебе, и моё сердце бьётся в такт твоему — так было решено в тот день
  у реки, когда я дал тебе слово. С тех пор я ни разу не усомнился в этом решении,
  и, пока ты рядом, не усомнюсь и впредь.
