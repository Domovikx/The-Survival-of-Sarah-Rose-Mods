name: Miriam
gender: F
age: 8-14
who: 'Маленькая дочь Сары и Варги в финальной семейной ветке; вместе с братом Орвеном
  тайком пробирается в спальню родителей, играет в «базилиска» и задаёт вопросы про
  сказки.

  Характер: Бойкая и дерзкая малышка: бьёт брата первой, спорит, но быстро извиняется
  перед мамой. Смышлёная — ловит отца на нестыковке, любопытная, с детской серьёзностью.
  Возраст — лет 6-8.

  Отношения: Сара — мама, Варга — отец (игровой «базилиск»), Орвен — брат, с которым
  вечно воюет.

  Стиль речи: Детская непосредственность: «Mom...», «Dad!», восклицания, наивные вопросы
  и короткие фразы.'
instruct_en: Female child, 6-8 years old, small and slim, bright round face with curious
  wide eyes, dark hair in a simple cut, quick bouncy movements, restless small hands
texts:
- Я говорила тебе, что ты был слишком громким! Все в доме слышали, даже старая кухарка,
  а она глуховата, честное слово! Теперь мама придёт и будет ругаться, и всё из-за
  тебя, а я же предупреждала, предупреждала тебя!
- Вы с дядей Томасом никогда не дрались? Правда-правда? А он говорит, что когда-то
  вы кидались подушками и одна даже попала в люстру! Расскажи, как это было, только
  не выдумывай, ладно? Я хочу знать всё-всё!
- 'Я пошла посмотреть, что там за шум, потому что мне стало очень любопытно, а любопытство
  у меня, как у кошки, которая залезла в чулан. Оказалось, интересно: там было столько
  необычного, что я даже не заметила, как прошло время!'
- 'Я делала то, что хотела, и мне было весело! Но мама говорит, что так делать плохо
  и что сначала нужно думать, а потом делать. А я думаю: если это весело, то почему
  бы и нет? Взрослые вечно что-то запрещают.'
- Я знаю секрет! Но не скажу. Я умею хранить секреты, честное слово, я даже маме не
  рассказала, а она умеет выпытывать. Если хочешь узнать, попробуй угадать, но я всё
  равно ничего не скажу, пока сама не захочу!
