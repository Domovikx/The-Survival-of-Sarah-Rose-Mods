name: Cassius
gender: M
age: 25-35
who: 'Красивый молодой раб на маскараде в поместье Гайледа — «ценное имущество» хозяина;
  позже в Калшуре — воин-освободитель, встречающий Сару как освободительницу города
  от племён.

  Характер: Циничный и меланхоличный острослов: иронизирует над своим положением,
  топит печаль в вине, флиртует с Сарой. Гордый воин, мечтающий о боях, лёгкий и самоироничный.

  Отношения: С Сарой — флирт и взаимное притяжение на маскараде; в Калшуре — уважение
  и готовность служить ей как освободителю.

  Стиль речи: Остроумный, с самоиронией и сарказмом, галантные комплименты, игривое
  обращение «Sarah-from-far-away».'
instruct_en: Male, 25-35 years old, warrior, tall and lithe with an athletic build,
  handsome chiseled face, dark tousled hair, graceful confident bearing of a trained
  swordsman, lean sinewy arms
texts:
- Я присягал ордену, и я держу своё слово, чего бы это ни стоило. Рыцарь Розы может
  рассчитывать на мой клинок и на мою преданность — так было, так есть и так будет,
  пока я дышу.
- Я слышал о ваших подвигах, и, должен признать, слухи не лгали. Редко встретишь человека,
  о котором молва говорит правду, но в вашем случае всё услышанное оказалось даже
  скромнее истины.
- Я бы счёл за великую честь сражаться рядом с вами, леди Сара. Мой меч служил многим
  достойным людям, но сражаться плечом к плечу с человеком вашей отваги — честь, о
  которой я не смел и мечтать.
- Я дал обет защищать слабых, и я не выбираю, кто достоин защиты. Долг рыцаря не спрашивает
  о титулах и богатстве, он требует лишь одного — быть там, где нужна помощь, и не
  отступать.
- Я думал, что видел всё, что может предложить этот мир, но ваша история заставила
  меня пересмотреть собственные взгляды и признать, что я ещё умею удивляться людям.
- Я не бросаю слов на ветер, леди. Если я обещал, значит, так и будет — даже если
  для этого придётся пройти через огонь и воду. Слово рыцаря дороже золота, и я знаю
  это с детства.
