name: Garret
gender: M
age: 30-45
who: 'Городской охотник приграничного городка (арка WarriorPath), где орудует зверь-убийца.
  Отец был охотником до него; сам уже месяцы выслеживает Бестию безуспешно. Вырезает
  тотемы для лесных духов и ведёт Сару по следам нападений.

  Характер: Грубый, прямой, с нецензурной лексикой, недоверчив к мэру и «большим»
  армиям. Под суровостью — боль о погибшей в шторм сестре и усталость; даёт Саре мудрый
  совет о лесах и о том, что нельзя вечно себя наказывать.

  Отношения: Сара — «Роза-рыцарь», к которой относится свысока, но постепенно уважает;
  мэр — противник массовой зачистки леса; Бестия — главный враг.

  Стиль речи: Просторечная, резкая, с местным колоритом, проклятия и житейская мудрость.'
instruct_en: Male, 30-45 years old, rangy lean hunter's frame, sun-worn face with
  stubble and crow's feet, long untidy hair, steady crouching gait of a tracker
texts:
- 'Ну, тот, кто вам это сказал, должно быть, идиот, уж извините за прямоту. Я в этих
  делах не первый год и знаю, о чём говорю: слухи в этом городе разлетаются быстрее
  монет на ярмарке, и доверять им — последнее дело.'
- 'Я помогал многим людям в этом городе, и не вижу причины не помогать и тебе. У меня
  простое правило: сделаешь добро — оно вернётся, а сделаешь зло — тоже вернётся,
  только с процентами. Так что я выбираю первое.'
- 'Я пошёл на эту сделку, потому что она выгодна обеим сторонам. В бизнесе так: если
  один остался в накладе, второй раз он к тебе не придёт, а мне нужны постоянные клиенты,
  а не разовая удача. Поэтому я всегда стараюсь, чтобы всем было хорошо.'
- 'Я делал бизнес с лучшими людьми этого королевства — и с худшими тоже, можешь мне
  поверить. С каждым из них я вынес один урок: за красивой улыбкой может прятаться
  кинжал, а за грубым словом — честная монета.'
- 'А вы, полагаю, Рыцарь Розы. Рад знакомству: о вас в городе говорят по-разному,
  но я предпочитаю судить о людях по делам, а не по слухам. Если понадобится что-то
  деловое, моя дверь всегда открыта, цены разумные.'
arcs:
- WarriorPath
instruct_ru: Мужской, 30-45 лет, жилистое поджарое телосложение охотника, обветренное
  лицо со щетиной и морщинками у глаз, длинные неопрятные волосы, устойчивая крадущаяся
  походка следопыта
