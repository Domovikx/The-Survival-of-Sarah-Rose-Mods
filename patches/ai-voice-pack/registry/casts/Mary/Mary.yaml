name: Mary
gender: F
age: 30-50
who: 'Пожилая рабыня-розанка в лагере кочевников (путь «Другое»): 20 лет в плену у
  старого солдата, помогает Саре освоиться в рабстве, а позже устраивает её побег
  с караваном.

  Характер: Сломленная, но не сломанная: горький цинизм, житейская мудрость, трезвый
  взгляд на выживание; в то же время человечная — предупреждает Сару, жалеет её, рискует
  собой ради её побега. Покорна хозяину, но с внутренним достоинством.

  Отношения: Со старым солдатом — жена-рабыня, привычное сожительство; с Сарой — старшая
  подруга и наставница, затем сообщница в побеге.

  Стиль речи: Просторечная, с диалектными оборотами, откровенная до грубости, с чёрным
  юмором; объясняет законы лагеря и обычаи племени.'
instruct_en: Female, 30-50 years old, slave, worn stooped figure from long years of
  captivity, weathered face with tired lines, grey-streaked hair, heavy slow gait,
  rough calloused hands
texts:
- Значит, он повеселился с тобой? Ну и правильно, так и надо, а то вечно у нас всё
  чинно да благородно, как на похоронах. Молодым положено шуметь и смеяться, пока
  есть силы, а я уж постою на страже у печи.
- 'Конечно, говорю, и на этом языке я говорю дольше, чем ты на свете живёшь, милая.
  Всякое мне приходилось слышать и переводить на кухне: и купеческие ругательства,
  и нежные слова, так что меня не удивить.'
- 'Я пошла работать на кухню с пятнадцати лет, сызмальства, можно сказать, и научилась
  здесь всему: и тесто ставить, и огонь уважать, и людей понимать по тому, как они
  едят. Кухня — это целый мир, девочка.'
- 'Я делала пироги для короля, и он всегда просил добавки, а это, поверь мне, высшая
  похвала для пекаря. Секрет прост: хорошее тесто, свежая начинка и капля любви, а
  остальное — дело привычки и верных рук.'
- Еда — это любовь, милая, запомни это. Если я тебя кормлю, значит, я тебя люблю,
  а если я тебя обхаживаю и подкладываю добавку, значит, ты мне как родная. В моей
  кухне голодным не уходит никто.
arcs:
