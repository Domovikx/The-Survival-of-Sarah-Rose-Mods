name: Dalia
gender: F
age: 20-30
who: 'Молодая женщина-маг, пленница «Мастера» в его башне в Опустошённом мире (MagePath):
  живёт в заточении уже 2-3 года, объясняет Саре устройство метки-поводка и историю
  гибели мира. Со временем становится её соседкой по камере, подругой и защитницей.

  Характер: Спокойная, рассудительная, смирившаяся с судьбой: успокаивает паникующую
  Сару, честно рассказывает о боли и унижении, но сохраняет тёплоту и заботу. Понимает,
  что Мастер заставит их предать друг друга, и честно предупреждает об этом.

  Отношения: С Сарой — сокамерница и подруга, делит постель и тайны; с Мастером —
  вынужденная послушница, объект насилия, которого боится и ненавидит.

  Стиль речи: Ровный, успокаивающий, объясняющий тон; рассказывает предания о магах,
  сожравших мир.'
instruct_en: Female, 20-30 years old, captive mage, slim and pale from years confined
  indoors, quiet still posture of someone long imprisoned, delicate features shadowed
  by weariness, long plain hair, slow careful movements
texts:
- 'Так и есть, и я здесь дольше тебя, так что поверь моему опыту: паника не поможет
  никому из нас. Хладнокровие спасло меня уже не раз, и каждый раз я выходила живой,
  пока вокруг метались и гибли другие.'
- 'Ну, я тоже была магом, как и ты. Мы обе совершили ошибку, за которую теперь расплачиваемся,
  так что осуждать тебя мне не пристало: кто сам падал, тот знает, как трудно снова
  подняться и не сорваться.'
- 'Не спеши. Сначала вдохни, потом решай, я прошу тебя. Здесь время течёт иначе, чем
  в твоём мире, и поспешность стоит дороже, чем где-либо ещё: один неверный шаг —
  и обратной дороги уже не будет.'
arcs:
- MagePath
instruct_ru: Женский, 20-30 лет, пленница-маг, стройная и бледная от долгого заточения,
  тихая неподвижная осанка привыкшей к неволе, тонкие черты лица, тронутые усталостью,
  длинные простые волосы, медленные осторожные движения
