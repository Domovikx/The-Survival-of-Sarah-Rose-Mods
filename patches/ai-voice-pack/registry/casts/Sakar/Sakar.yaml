name: Sakar
gender: M
age: 20-30
who: 'Ветеран-наёмник из банды Сигмунда, возящей грузы по Старой дороге между королевствами.
  Встречает Сару, когда Сигмунд подбирает её, и сопровождает до Галлоу-Крик. В WarriorPath
  — главный любовный интерес Сары с грубой страстью и неожиданной уязвимостью.

  Характер: Грубый, циничный, матерящийся боец со шрамами. К Саре сперва враждебен,
  потом оттаивает. За жёсткостью прячет робость и одиночество.

  Отношения: С Сигмундом — подчинённый-ворчун, с Крипом — напарник; с Сарой — от насмешек
  и опасных намёков до страстного романа и предложения жить вместе.

  Стиль речи: Грубая мужская речь с матом и жаргоном дороги, обращения ''girly'',
  философские рассуждения о жизни в дороге; в романтике — ласково-приказной тон.'
instruct_en: Male, 20-30 years old, mercenary, lean and wiry with a scarred weathered
  face, calloused hands, quick agile movements, slouched streetwise stance
texts:
- Я вырос на этих причалах, красотка, среди бочек, канатов и нечестных сделок, так
  что знаю, где прячут деньги, кто за ними придёт и кому лучше не попадаться в тёмном
  переулке после заката.
- 'Я бы этому типу не доверил даже мокрой верёвки, а уж тем более своих денег или
  спины в тёмном проулке: он такой же ублюдок, как и все мы, только умеет прикидываться
  порядочным, а это опаснее.'
- За одну эту ночь я заработал больше, чем за весь прошлый месяц на разгрузке вонючих
  трюмов, и всё благодаря тебе, так что если решишь ещё раз встрять в какую-нибудь
  авантюру — зови, я уже понял, что ты приносишь удачу.
- 'Я не жалуюсь на жизнь — кто я такой, чтобы жаловаться, — но иногда море требует
  своё: то шторм смоет улов, то шкипер не заплатит, а у меня всего две руки и один
  кошель, который надо чем-то наполнять.'
- 'Я же ему говорил: не лезь в драку, если не готов лежать лицом в грязи, — так нет,
  полез, решил, что он круче всех в порту, ну и получил по заслугам. Сам виноват,
  я свою совесть чистой держу.'
- Я провёл нас через порт так, что нас не заметила ни одна стража, — знаю здесь каждую
  дыру в заборе и каждый закуток, где можно переждать, так что просто иди за мной
  и не задавай лишних вопросов.
arcs:
- WarriorPath
