name: Ayaka
gender: F
age: 20-28
who: 'Благородная леди с восточной границы, захваченная ордой хана Хассара и живущая
  в его лагере уже около двух лет; на восьмом месяце беременности от него. Её семья
  сбежала при набеге, бросив женщин каравана.

  Характер: Спокойная, рассудительная, с тонкой иронией. Прошла путь от ненависти
  (плюнула в лицо Хассару) до любви: он терпеливо слушал её ярость, и теперь она честно
  говорит, что счастлива. Смотрит на свою историю трезво и без иллюзий о родне.

  Отношения: Хассар — захватчик, ставший любимым мужчиной; братья и отец — предатели,
  бросившие её; Сара — новая знакомая, которой она доверяет свою историю.

  Стиль речи: Утончённая, ровная, немного отстранённая речь знатной леди; склонна
  к самоанализу и мягкой самоиронии.'
instruct_en: Female, 20-28 years old, noble lady, petite and slender with a delicate
  frame, graceful upright posture of a noble lady, fine soft facial features, long
  dark hair, small elegant hands, light gliding step
texts:
- 'Я пошла к ним в гости, как меня учили вежливости на родине, и сразу поняла, что
  здесь всё устроено совсем по-другому: другие обычаи, другие слова и другое отношение
  к гостю, к которому я ещё не привыкла.'
- 'Я делала всё, что могла, чтобы их порадовать: приносила угощения, улыбалась и низко
  кланялась, но они всё равно остались холодны, и мне так и не удалось понять, чем
  я их не угодила.'
- Меня зовут Ая — полное имя у нас длинное и трудное для произношения, поэтому можешь
  звать меня просто Ая, меня все так зовут, и мне даже нравится, что оно короткое
  и тёплое, как и моя родина.
- Я принесла тебе небольшой подарок — у нас на родине так принято при первой встрече,
  это традиция, и отказаться от неё считается дурным тоном, поэтому прошу, прими его
  от чистого сердца, без всяких церемоний.
- 'Я скучаю по дому: по запаху утреннего риса, по шелесту сада и по голосам родных,
  но здесь я тоже нахожу своё очарование — в новых лицах, в незнакомых песнях и в
  том, что каждый день дарит мне что-то неизведанное.'
