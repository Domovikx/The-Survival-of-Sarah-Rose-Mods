name: King Orwell Rose
gender: M
age: 50-60
who: 'Король Розанны, отец Сары и Томаса. Возвращается из объезда восточных провинций
  с тревожными слухами о Хассаре, воспитывает наследников, погибает (убийство), после
  смерти является как наставник-дух.

  Характер: Сдержанный, величавый и требовательный к наследникам, но тёплый с дочерью
  — шутит, просит её присматривать за братом. Мудрый стратег-политик: объясняет дипломатию
  метафорой танца. В посмертной сцене — благословляющий и мудрый.

  Отношения: С Сарой — любящий отец и собеседник, с Томасом — строгий наставник о
  долге короля, с советом — верховный правитель.

  Стиль речи: Размеренная, весомая речь с наставлениями, метафорами и государственными
  рассуждениями; дома — отеческая теплота.'
instruct_en: Male, 50-60 years old, king, tall commanding stature, weathered regal
  face with grey beard, straight-backed posture, heavy measured stride
texts:
- Я правил этим королевством тридцать лет, и за всё это время я не видел ничего страшнее
  безразличия совета. Войны я пережил, чуму пережил, голод — а вот равнодушие тех,
  кто должен думать о народе, пугает меня до сих пор.
- Я горжусь тобой, дочь, больше, чем могу выразить словами, и больше, чем ты когда-либо
  узнаешь. Я видел, как ты росла, как падала и поднималась, и каждый твой шаг напоминал
  мне, зачем я вообще взял на себя эту корону.
- 'Я принял решение, которое будет стоить мне многого: возможно, покоя, а возможно,
  и куда большего. Но король обязан платить первым — так меня учили, и так я живу.
  Если цена моих ошибок падёт на народ, значит, я не выполнил свой долг.'
- 'Я помню день, когда ты родилась: весь замок замер в тишине, слуги боялись дышать,
  а я стоял в дверях и не мог сдержать слёз. В ту ночь я узнал, что такое настоящая
  любовь, — до этого я знал только слово, а тут узнал чувство.'
- 'Я был слишком мягок с тобой, Сара, слишком часто закрывал глаза на твои шалости
  и позволял тебе идти куда вздумается. Но пришло время научить тебя тому, что я знаю
  сам: как быть королём и как не потерять себя в этой короне.'
