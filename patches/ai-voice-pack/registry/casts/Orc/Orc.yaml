name: Orc
gender: M
age: 30-40
who: 'Орк-похититель/надзиратель Сары в лагере племени: волочит её по снегу на верёвке,
  запирает в клетке, насилует как «человеческую шлюху».

  Характер: Грубый, яростный и примитивный: говорит ломаными обрывками языка, движим
  ненавистью и похотью. При этом показан не тупым — умелый охотник и ремесленник племени;
  ухмыляется, глядя на Сару в клетке.

  Отношения: С Сарой — пленитель/жертва: приказы, побои, насилие; с Ником — утаскивает
  его в сторону от Сары.

  Стиль речи: Ломаный язык человека: короткие приказы-рубленые фразы («Walk!», «You
  stay. You learn.», «Human whore!»), гортанно, с трудом подбирая слова.'
instruct_en: Male, 30-40 years old, orc warrior, towering muscular brute with broad
  shoulders, ugly scarred face with heavy tusks, coarse dark hair, lumbering powerful
  gait
texts:
- Ты идти. Ты слушать. Я говорить, ты слушать, и никто не перечить! Я хозяин здесь,
  и моя рука тяжёлая, а слово орка короче его меча, но вернее его удара!
- Мой клан живёт в этих горах дольше, чем твои деды учили своих дедов бояться нас!
  Ты будешь работать, ты будешь слушаться, и тогда, может быть, я не отдам тебя племени!
- 'Я не любить человеческая болтовня! Я делать, я брать, я не спрашивать! Ты видеть
  моя спина — ты знать: я охотился, я воевал, я приводил добычу, и вождь меня уважает!'
- Человеческая шлюха думать, что может убежать от орков? Глупый маленький заяц! В
  этих горах нет тропы, которую я не знаю, и нет укрытия, где я тебя не найду!
- Ты кормить меня сегодня! Ты готовить, ты мыть, ты молчать! Если вождь доволен, я
  добрый орк, а если нет — я злой орк, и злой орк хуже горного обвала, запомни это!
arcs:
- MagePath
instruct_ru: Мужской, 30-40 лет, орк-воин, громадный мускулистый детина с широкими
  плечами, уродливое изрубленное лицо с тяжёлыми клыками, грубые тёмные волосы, грузная
  мощная поступь
