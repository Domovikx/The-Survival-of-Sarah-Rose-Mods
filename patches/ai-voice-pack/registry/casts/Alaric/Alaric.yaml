name: Alaric
gender: M
age: 25-30
who: 'Уличный карманник-вор из трущоб, спутник и любовник Сары в уличной ветке: сначала
  торгует с ней сексом за ночлег, потом ведёт её по улицам как напарник. В магической
  ветке снова всплывает мелким воришкой, пытающимся обокрасть дом Сары, а после побега
  — её жестокий пьяный сожитель.

  Характер: Грубый, вульгарный и циничный, живёт одним днём, не помнит лет и гордится
  уличным чутьём, хотя реально ворует посредственно. Эгоистичен и уязвим на уколы
  по самолюбию — отвечает оскорблением или рукоприкладством. Склонен к хвастовству
  и грязным шуточкам про секс.

  Отношения: Сара: от случайного секса за деньги — к напарничеству по кражам и абьюзивному
  роману (ревнует, душит, рвёт одежду); в MagePath предлагает ей «хайсты» и делит
  выручку.

  Стиль речи: Уличный сленг: «ain''t ya», «tryna», «girly», «gotta», «aight», мат,
  короткие рубленые фразы, шутки про её «богатое» происхождение.'
instruct_en: Male, 25-30 years old, thief, lean and wiry with quick agile movements,
  sharp angular face with a knowing smirk, scruffy unkempt hair, nimble fingers, slouched
  streetwise posture
texts:
- Я прошёл через весь город, через эти грязные закоулки и вонючие рынки, только чтобы
  добраться до тебя, и, представь себе, ни разу не пожалел о потраченном времени —
  хотя по моим правилам чужие просьбы обычно стоят дороже.
- Я делал всё, что было в моих силах, чтобы вытащить нас обоих из этой передряги,
  но поверь мне, когда на кону стоит шкура, решения приходится принимать быстро, без
  лишних вопросов и красивых речей.
- Я сегодня утром нашёл этот прелюбопытнейший артефакт в одной грязной подворотне
  — казалось бы, на что там надеяться, — и сразу подумал, что он наверняка пригодится
  тебе в твоих делишках, ради которых ты готова перевернуть весь город.
- Мы с тобой прошли через столько передряг, что я уже давно перестал их считать и
  запоминать — осталась только эта привычка наслаждаться моментами рядом с тобой,
  даже когда всё вокруг горит синим пламенем.
- Я всю жизнь старался держаться подальше от знатных особ и их интриг, но рядом с
  тобой я, кажется, готов нарушить собственные правила — тем более когда от этого
  зависит наша общая выгода и мой кошелёк.
