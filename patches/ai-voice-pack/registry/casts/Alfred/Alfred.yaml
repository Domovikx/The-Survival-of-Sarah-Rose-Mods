name: Alfred
gender: M
age: 45-60
who: 'Старик, глава поместья Гилеада (управляющий) — суровый надзиратель, нанимающий
  Сару в прислугу. Позже (GallowCreek/AlfredPath) — дряхлый, почти умирающий вдовец,
  которого Сара соглашается оживить и за которого выходит замуж, спасая его от смерти.

  Характер: Двуличен: на работе — требовательный, придирчивый, с презрением к «нынешним
  работникам»; дома — порочный старик, который ночью пробирается в комнату гостьи,
  а после женитьбы — восторженный и одержимый. Хищник под маской хозяина.

  Отношения: С Сарой — сначала работодатель, потом ночной домогатель, затем муж; с
  сыном Мариусом — отец, которого тот обслуживает.

  Стиль речи: Просторечная строгая речь хозяина, приказы и угрозы увольнением; в старости
  — сбивчивый, мямлит, оправдывается; после женитьбы — пафосные клятвы и восторги.'
instruct_en: Male, 45-60 years old, estate steward, stout and heavy-set but already
  fading with age, deeply lined face with sagging jowls, thinning grey hair, slow
  heavy gait, gnarled hands
texts:
- Я держу это заведение уже двадцать лет, девочка, и за это время я научился видеть
  людей насквозь. Стоит мне глянуть, как кто-то входит, и я уже знаю, останется он
  до утра или сбежит, не заплатив.
- 'Я был молод, как и ты, и тоже думал, что весь мир лежит у моих ног. Жизнь быстро
  объяснила обратное: она бьёт по карману, по гордости и по спящим, а утром ты просишь,
  чтобы она хотя бы дала тебе подняться.'
- 'Я не спрашиваю лишнего и от тебя не требую. Плати вовремя, не ломай мебель, не
  дерись у стойки — и мы поладим. Остальное меня не касается: я всего лишь трактирщик,
  а не судья и не исповедник.'
- 'Я сказал Мариусу, что ты особенная. Он, конечно, сделал вид, что не услышал, —
  у него вечно свои мысли в голове, — но я-то знаю: он запомнил. Парень не дурак,
  просто любит прикидываться, будто ему всё равно.'
- Я помню, как этот город ещё был деревней с одной таверной. Моей. Теперь их тут полтора
  десятка, а люди всё равно приходят ко мне, потому что я помню их дедов и знаю, кто
  кому и чем обязан.
- 'Я налил тебе самого лучшего, что у меня есть. Не спрашивай, откуда оно: у каждого
  трактирщика есть пара бутылок, о которых не говорят вслух. Пей, грейся у очага,
  а разговоры пусть подождут до утра.'
