name: Kravel
gender: M
age: 35-50
who: 'Крэвел — шпионмейстер королевства, член совета: ведёт сеть шпионов и дозоры,
  докладывает о войске Хассара, расследует заговор против короля, предлагает держать
  заложников из рода Хайфилдов.

  Характер: Осторожный, методичный аналитик; честно признаёт границы знаний, просчитывает
  риски. Верен трону, дипломатичен, к генералу Бариону относится с мягкой иронией.

  Отношения: С королём и принцессой — почтительный докладчик; с советом — сдержанный
  оппонент; с Барионом — колкие замечания в его адрес.

  Стиль речи: Формальная придворная речь с оговорками («I fear», «to be entirely accurate»),
  уточнениями и анализом; никакой грубости, всё взвешено.'
instruct_en: Male, 35-50 years old, spymaster, slender unremarkable build, nondescript
  face that blends into crowds, hooded watchful eyes, quiet soft-footed movements
texts:
- Я служу короне не мечом, а тишиной, и моя работа — знать то, чего не знают другие.
  Чей шёпот в коридоре, чьи следы на пыльной лестнице, чьи письма приходят с чужой
  печатью — всё это проходит через мои руки.
- 'Я бы не советовал вам обсуждать это вслух, даже вполголоса. У стен этого замка
  длинные уши, а у каждой двери — своя память: слова, сказанные сегодня, завтра могут
  стать приговором тому, кто их произнёс.'
- 'Я проверил твоих людей, как ты и просил. Трое из них доносят на тебя, двое пока
  раздумывают, а один и вовсе продаёт твои тайны тому, кто платит больше. Дальше решай
  сама, но знай: я смотрю за всеми.'
- 'Я предупреждал короля о заговоре ещё за год до того, как всё случилось, и называл
  имена и сроки. Меня, как обычно, услышали слишком поздно: мои донесения читают тогда,
  когда они уже не могут ничего изменить.'
- Я не верю в совпадения, особенно в те, что случаются дважды, а в моей работе совпадения
  вообще означают, что кто-то очень старательно их подстроил. Следи за тем, что кажется
  случайным, и найдёшь того, кто за этим стоит.
- 'Я знал твоего отца лучше, чем он сам думал: я слышал его мысли прежде, чем он их
  произносил. И я видел, как его предали те, кому он верил, — поэтому я и говорю тебе:
  доверяй, но проверяй.'
