name: Marion
gender: M
age: 20-30
who: 'Глава дома Achillea — одной из древнейших аристократических семей Розанны, советник
  и соперник королевской семьи. Интриган при дворе: продвигает интересы старых родов,
  предлагает Саре брак по расчёту. В ветке MarionPath после свадьбы раскрывается как
  домашний тиран-садист.

  Характер: Внешне любезен, льстив и снисходителен, но циничен: ''love is a bit of
  an overstated emotion when it comes to marriage''. В постели — жёсткий доминант:
  угрожает, приказывает, унижает и манипулирует, способен на ярость.

  Отношения: С Томасом и Сарой — почтительный вассал и претендент на руку принцессы;
  с Варгой — открытая вражда. Голос старых родов при дворе.

  Стиль речи: Образованная светская речь, книжные обороты, рассуждения о долге и чести
  семьи; в приватных сценах — резкие короткие приказы и грубость.'
instruct_en: Male, 20-30 years old, aristocrat, tall and lean with a narrow aristocratic
  frame, pale handsome face with thin lips and sharp jawline, immaculate dark hair,
  rigid upright posture, precise elegant gestures
texts:
- 'Я вырос среди знати, и меня учили, что слово дворянина стоит дороже золота, а имя
  — дороже жизни. Я не собираюсь менять это правило: даже если весь двор забыл о чести,
  я буду держать слово, данное принцессе, до конца своих дней.'
- Я смотрел на тебя весь вечер, Сара Роуз, и ни разу не пожалел об этом. В зале, полном
  лиц и масок, твоё лицо было единственным настоящим, и я поймал себя на том, что
  забыл, о чём говорили остальные гости.
- Я прибыл по приглашению вашего отца, чтобы обсудить дела королевства, но остался
  здесь ради вашего общества, принцесса. Делёж земель и налогов подождёт до утра,
  а такой вечер, как сегодня, не повторяется дважды.
- 'Я был бы счастлив сопровождать вас на прогулке, если вы позволите: в саду сейчас
  цветут розы, а утренний туман над рекой — зрелище, которое стоит увидеть. Обещаю
  быть учтивым и не занимать вас разговорами о политике.'
- 'Я заявляю перед всеми этими людьми о своей любви к тебе, и пусть каждый здесь будет
  свидетелем моих слов. Прошу тебя, Сара Роуз, окажи мне честь стать твоим мужем:
  я клянусь беречь тебя, уважать твою волю и быть рядом, когда это нужнее всего.'
