name: Naydeen
gender: F
age: 25-35
who: 'Женщина из окружения Хассара в Аль-Гахаеме (HassarPath): первая встречает Сару
  в доме, отводит её в комнату, распоряжается слугами. Позже — наставница Сары в ''телесных
  искусствах'' (18+).

  Характер: Радушная и властная хозяйка: тепло встречает гостью, заботится о ней,
  но в интимной сцене — уверенная доминантка: ''your training has only just begun''.

  Отношения: С Сарой — гостеприимная покровительница, переходящая в сексуальную наставницу;
  с Софией (служанкой) — мягко-повелительна; упоминает Хассара.

  Стиль речи: Плавная, успокаивающая речь с ласковыми оборотами, короткие уверенные
  фразы-приказы в постели.'
instruct_en: Female, 25-35 years old, housekeeper, tall commanding figure, full-figured
  and stately, composed face with dark watchful eyes, dark hair gathered up, regal
  upright posture, unhurried graceful gait
texts:
- 'Я пошла проверить, что здесь происходит, потому что тишина в таких делах — плохой
  знак. Оказалось, что шум — это только начало: за ним потянулись слухи, потом споры,
  а теперь вот и я стою перед тобой, пытаясь понять, где правда.'
- Я делала то, что считала нужным, и не собираюсь оправдываться ни перед кем. Каждое
  моё решение было взвешено, каждое слово обдумано, и если кто-то с ним не согласен
  — это его право, но не повод для меня сомневаться.
- 'Власть — это не сила, как многие ошибочно думают. Это ответственность, которую
  я несу каждый день: за каждое решение, за каждое слово, за людей, которые на меня
  смотрят. Иногда хочется, чтобы кто-то взял этот груз, но я не могу его отдать.'
- Я знала, что придётся принимать трудное решение, и долго откладывала этот момент,
  надеясь, что всё разрешится само собой. Но чудес не бывает, поэтому я собралась
  и приняла его — так, как считала правильным, не оглядываясь на чужое мнение.
- Меня не сломали в молодости — ни голод, ни одиночество, ни те, кто считал, что мной
  можно управлять. Не сломают и сейчас. Я научилась стоять на ногах, когда вокруг
  рушится всё, и эта наука остаётся со мной, что бы ни случилось дальше.
arcs:
- HassarPath
