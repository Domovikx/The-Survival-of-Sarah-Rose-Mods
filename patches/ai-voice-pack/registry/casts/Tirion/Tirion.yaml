name: Tirion
gender: M
age: 55-75
who: 'Пожилой священник храма в замке Рейнмир, духовный наставник. В единственной
  сцене (эпилог) принимает Сару в храме, радуется её визиту, расспрашивает о детях
  и даёт наставление о покое перед грядующей войной.

  Характер: Мягкий, смиренный, мудрый: извиняется, что потревожил, деликатно выпытывает
  причину визита. Верит, что покой — это подготовка к буре: ''The silence before the
  storm''.

  Отношения: С Сарой — пастырь и добрый знакомый, ждёт её визитов; вспоминает годы
  служения в провинции, где мирил враждующие семьи.

  Стиль речи: Учтивый, книжно-архаичный стиль с молитвенными оборотами, притчи из
  собственной жизни, наставления о терпении.'
instruct_en: Male, 55-75 years old, priest, thin and frail with a stooped back, deeply
  lined face, knotted aged hands, slow shuffling gait
texts:
- 'Прошу прощения за то, что подошёл так тихо, но ты была настолько погружена в молитву,
  что я боялся: любой шум, любой скрип половиц напугает тебя и оборвёт эту беседу
  с небесами, которая, судя по всему, была тебе дорога.'
- 'Как бы то ни было, я был по-настоящему счастлив видеть тебя здесь: в мои годы редкие
  встречи становятся дорогим подарком, и каждая из них оставляет в душе след, как
  отметина на старом пергаменте, исписанном годами.'
- Я прожил долгую жизнь, дольше, чем большинство из тех, кого я знал, и видел много
  хорошего и много дурного. Хорошее я бережно храню в памяти, а дурное — как учитель,
  который бил по рукам, но научил не ошибаться.
- 'Я делал ошибки, и немало, в этом я честен перед собой. Но я учился на них, каждый
  день, каждый час, и теперь знаю: мудрость — это не то, что ты знаешь, а то, что
  ты успел понять, пока спотыкался и поднимался.'
- 'Мудрость приходит не с годами, запомни это: седина не делает человека умнее. Она
  приходит с болью, с потерями, с теми ночами, когда не спишь и перебираешь свои ошибки,
  и только тогда ты начинаешь видеть мир таким, каков он есть.'
