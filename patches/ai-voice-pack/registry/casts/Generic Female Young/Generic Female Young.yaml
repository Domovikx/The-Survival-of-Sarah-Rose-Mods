name: Generic Female Young
gender: F
age: 18-30
who: Универсальный молодой женский типаж, естественный, мягкий, нейтральная разговорная
  речь; накрывает Sophia, Lily, Mary, Eula, Elsa и др.
instruct_en: Female, 18-30 years old, medium height with a slender average build,
  pleasant unremarkable face, neat hair, natural posture, easy unhurried stride
texts:
- Проходи же, не стой на пороге, как чужая! Чай уже остывает, а истории лучше рассказывать
  у тёплого очага, а не на холодной улице, где ветер уносит половину слов — садись
  ближе, я как раз согрела для нас кувшин.
- Я слышала, что за лесом по ночам видели странные огни, похожие то ли на костры,
  то ли на чьи-то глаза; люди в деревне шепчутся об этом, но никто так и не решается
  сходить и проверить своими глазами, что там происходит.
- Если хочешь, оставайся у нас сколько понадобится — места в доме хватит, а лишняя
  пара рук в хозяйстве никогда не помешает, особенно в такое время, когда каждый уважающий
  себя путник знает цену крыше над головой.
instruct_ru: Женский, 18-30 лет, средний рост, стройное обычное телосложение, приятная
  ничем не примечательная внешность, аккуратные волосы, естественная осанка, лёгкая
  неторопливая походка
