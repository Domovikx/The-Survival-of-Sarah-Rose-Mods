name: Carolyn
gender: F
age: 40-50
who: 'Леди Каролин — казначей королевства, член королевского совета Розанны. Служила
  отцу Сары, теперь советница принцессы и Томаса: готовит коронацию, ведёт переговоры
  с лордом Гайлеадом ради поддержки, сопровождает Сару в походе за возвращение Розанны.

  Характер: Уверенная в себе женщина в мужском мире, спокойная, рассудительная, матерински-покровительственная
  («dear», «my dear»). За мягкостью — жёсткий прагматик: советует «обещать всё и не
  выполнять ничего», манипулировать союзниками; резко обрывает Сару, когда та отвергает
  её план.

  Отношения: С Сарой — наставница и конфидентка с детства; с Томасом — почтительная
  советница («my prince», «my liege»); с Гайлеадом — организатор встречи и сваха-политик.

  Стиль речи: Изысканная, обтекаемая придворная речь с притчами (о банкирах и риске),
  наводящими вопросами и формулами «Of course», «quite right».'
instruct_en: Female, 40-50 years old, royal treasurer, stately figure with an upright
  confident carriage, composed face with fine lines of experience, elegant greying
  hair, unhurried measured gait, well-kept hands of a court lady
texts:
- 'Я провела долгие годы, изучая тонкости королевских финансов, отчётности и налоговых
  сборов, и могу с полной уверенностью заявить: ни один банкир этого королевства не
  сравнится со мной в расчётах, когда речь заходит о деньгах.'
- Я за свою карьеру вкладывалась в самые разные предприятия — от торговых домов до
  портовых складов, — и каждый раз выходила победительницей, потому что умела считать
  ходы наперёд, полагаясь на свою проницательность и многолетний опыт.
- 'Я сегодня утром обсудила с королевским советом новые условия торговли и осталась
  довольна собой: даже самые придирчивые советники были впечатлены моей проницательностью
  и глубиной знаний о рынке, чего обычно от них не дождёшься.'
- Мы с тобой знаем друг друга с тех пор, когда ты ещё бегала по замку маленькой девочкой,
  и я всегда видела в тебе скрытый потенциал — в твоих глазах горела та же искра,
  что когда-то вела меня саму к вершинам.
- Я всегда говорила, что жизнь — это игра, и тот, кто умеет считать ходы и читать
  чужие намерения, всегда выходит победителем, даже когда ситуация кажется безнадёжной,
  — я проверяла это правило на себе не раз.
