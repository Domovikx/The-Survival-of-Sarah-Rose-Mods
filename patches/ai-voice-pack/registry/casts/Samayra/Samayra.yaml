name: Samayra
gender: F
age: 17-19
who: 'Дочь шаха Баграда, спасённая Сарой из рук митранских солдат, собиравшихся продать
  её с аукциона. Впоследствии — возлюбленная Сары и её квартирмейстер/командир в поздних
  арках.

  Характер: Мягкая, эмоциональная и благодарная девушка: слёзы благодарности, лёгкая
  улыбка, деликатность. По мере развития взрослеет, становится твёрже: заявляет, что
  остаётся с Сарой по собственному выбору, отдаёт военные приказы. Преданная и любящая.

  Отношения: С Сарой — спасительница, затем любовь и партнёрство; отец-шах погиб,
  воспоминания о нём тяжёлые; митранские солдаты — пленители.

  Стиль речи: Вежливая, с восторженными повторами благодарности, позже — тёплая лирика
  признаний и сухие формальные военные доклады.'
instruct_en: Female, 17-19 years old, princess, slender and delicate with a soft round
  face, graceful bearing, gentle hesitant posture, light unhurried movements
texts:
- Я выросла во дворце, где каждый день был наполнен праздниками и радостью, но теперь
  я понимаю, что настоящая ценность — это не балы и наряды, а близость людей, которых
  ты любишь и которые любят тебя в ответ.
- 'Я делала всё, что могла, чтобы поддерживать свою семью в трудные времена, даже
  когда мне самой было страшно и одиноко, потому что я верила: если я буду держаться,
  то и они выстоят.'
- Я сегодня утром гуляла по садам дворца и думала о том, как сильно изменилась моя
  жизнь за последние месяцы. Раньше я смотрела на цветы и видела только красоту, а
  теперь вижу ещё и их хрупкость.
- Мы с тобой провели столько прекрасных моментов вместе, и я надеюсь, что впереди
  нас ждёт ещё много таких же тёплых и счастливых дней, как те, что мы уже разделили
  на двоих.
- Я всегда верила в добро и справедливость, потому что даже в самом тёмном мире найдётся
  место для света и надежды. Отец учил меня, что королевская семья обязана нести этот
  свет другим, и я хочу быть достойной его уроков.
