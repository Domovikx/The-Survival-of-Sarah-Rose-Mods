name: Albert
gender: M
age: 40-60
who: 'Пожилой мастер портняжной мастерской поместья/академии; берёт Сару в ученицы,
  якобы спасая от того, что «пожирает» исчезающих горничных, но на деле — хищник:
  использует её как любовницу, оплодотворяет и шантажом принуждает к браку.

  Характер: Двуличен: сначала заботливый и тревожный, затем — властный, брезгливый
  и унижающий. Контролирует каждый шаг, поправляет «attitude», угрожает наушничеством
  главе, но при этом деловито-расчётлив: решает вопрос брака как сделку с документами.

  Отношения: Сара — «ученица»→любовница→будущая жена, которую держит на поводке угроз;
  упоминаются исчезающие девушки-горничные.

  Стиль речи: Сначала старомодно-ласковый («Well done, girl!», «Good girl»), потом
  — откровенно-похабный, приказной и угрожающий.'
instruct_en: Male, 40-60 years old, old tailor master, lean and slightly stooped from
  years bent over his work, weathered face with fine wrinkles, thin skilled fingers
  of a tailor master, neat precise movements, thinning grey hair
texts:
- text: Я наблюдал за тобой некоторое время, Сара. Должен признать, ты не разочаровала.
    Много лет я читаю людей по походке и взгляду, и в тебе я вижу то, что редко встречается
    даже среди знати.
  emotion_en: Calmly, with quiet confidence and a hint of appraisal
  emotion_ru: Спокойно, с тихой уверенностью и лёгкой оценивающей ноткой
- text: Я бы хотел обсудить с тобой одно дело, Сара. Не здесь, разумеется, и не сейчас
    — в поместье у стен есть уши, а мои дела любят тишину и уединение, как и положено
    делам портного.
  emotion_en: In a hushed tone, with cautious secrecy
  emotion_ru: Вполголоса, с осторожной скрытностью
- text: Я держу это поместье в порядке уже много лет, и у меня на то свои причины.
    Каждая нить здесь на своём месте, каждый шов сделан моими руками, и я привык отвечать
    за каждую мелочь в этом доме.
  emotion_en: Firmly, with measured authority
  emotion_ru: Твёрдо, с размеренной властностью
- text: Я помню, как всё начиналось, и я помню, кто чем обязан. Прошли годы, сменились
    хозяева, но память моя не ослабла, и долги свои я держу в голове крепче, чем нить
    в игле.
  emotion_en: Somberly, with quiet weariness and a bitter undertone
  emotion_ru: Сумрачно, с тихой усталостью и горьким подтекстом
- text: Я не сторонник громких слов, Сара. Предпочитаю тихие и точные, как хороший
    стежок. Многословие портит и ткань, и дело, а я за свою жизнь не переделывал работу
    дважды.
  emotion_en: Dryly, with restrained sarcasm
  emotion_ru: Сухо, со сдержанным сарказмом
- text: Я сказал тебе ровно столько, сколько нужно было сказать, и ни словом больше.
    Остальное узнаешь, когда придёт время, а до той поры советую запастись терпением
    — оно тоже часть ремесла.
  emotion_en: Icy, with controlled restraint, hiding a threat
  emotion_ru: Ледяно, со сдержанностью, пряча угрозу
arcs:
- LifeInRahayal
instruct_ru: Мужской, 40-60 лет, старый мастер-портной, сухощавый, слегка сутулый
  от многолетней работы согнувшись над шитьём, обветренное лицо с мелкими морщинами,
  тонкие умелые пальцы мастера-портного, аккуратные точные движения, редкие седые
  волосы
