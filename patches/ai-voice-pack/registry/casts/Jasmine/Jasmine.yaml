name: Jasmine
gender: F
age: 20-28
who: 'Картографша орды, партнёрша Джаейда по работе в комиссии по отношениям с иноземными
  державами; тоже бывшая рабыня из той же провинции, что и Джаейд. Объясняет Саре
  законы и культуру племён, предупреждает о реальных опасностях города.

  Характер: Острая на язык, саркастичная и циничная: встречает Сару колкостями, но
  быстро теплеет. Трезво и без иллюзий смотрит на рабство, защищается чёрным юмором.
  Практичная, деловая, ценит ум.

  Отношения: Джаейд — партнёр, с которым перешучивается на равных; Сара — подопечная,
  которую инструктирует по выживанию; племена и их воинская культура — предмет её
  постоянных объяснений.

  Стиль речи: Разговорно-колкий, с иронией и грубоватыми шутками, деловые термины
  картографии, откровенные предупреждения без смягчения.'
instruct_en: Female, 20-28 years old, cartographer, petite nimble frame, sharp intelligent
  eyes, quick precise movements, ink-stained fingers
texts:
- 'Какого чёрта ты устроил такой жуткий шум? Я чуть не выронила чашку, а у нас и так
  посуды меньше, чем хотелось бы. Скажи честно: ты специально решил меня напугать
  или просто не умеешь ходить тихо, как нормальный человек?'
- 'Клянусь, ты дома ни минуты, а я уже на взводе! Только я успела выдохнуть и подумать,
  что день будет спокойным, как ты врываешься со своими шумными затеями. Даже не знаю:
  радоваться мне или бежать прятаться куда подальше.'
- 'Я пошла проверить, что там за шум: думала, может, что-то упало или соседи опять
  скандалят. Оказалось — ты. Ну конечно, кто же ещё устроит переполох в самом начале
  дня, пока все нормальные люди ещё спят.'
- Я делала вид, что не замечаю твоих глупостей, и, поверь, это очень сложно, когда
  они происходят у меня прямо под носом. Но я же тебя люблю, так что приходится терпеть,
  закрывать глаза и делать вид, что всё в порядке.
- Ты всегда был таким беспокойным, или это новая черта, которую ты приобрёл совсем
  недавно? Раньше ты вроде умел сидеть спокойно хотя бы полчаса, а теперь носишься,
  будто за тобой гонится целая стая собак.
