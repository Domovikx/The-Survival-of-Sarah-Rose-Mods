name: Dio
gender: F
age: 20-30
who: 'Дио — «сестра по войне» Кассия, митрийская рабыня-солдат из Института войны;
  после освобождения решает не быть фермером, а воевать за дело, в которое верит.

  Характер: Сдержанная, рассудительная, философичная; без горечи объясняет митрийскую
  систему рабства, трезво смотрит на свободу; верна Кассию.

  Отношения: С Кассием — сестра по оружию и спутница; с Сарой — собеседница и союзница,
  впервые в жизни заключает «сделку» как с равной.

  Стиль речи: Ровная, книжная речь без просторечий, афоризмы, риторические вопросы,
  спокойная уверенность.'
instruct_en: Female, 20-30 years old, soldier, lean and hardened with a warrior's
  athletic frame, sharp weathered features, dark hair tied back tightly, disciplined
  erect posture, steady purposeful stride, scarred forearms
texts:
- Я пошла за Кассием не потому, что он прав, а потому, что он мой брат, и я не бросаю
  своих, даже когда они творят глупости и втягивают нас в неприятности, из которых
  потом приходится выкарабкиваться мне.
- 'Я дралась с ними на мечах и на кулаках и не проиграла ни разу, сколько бы их ни
  было, — хочешь проверить на себе? Только предупреждаю: пощады от меня не жди, я
  бью наверняка и не люблю, когда меня недооценивают.'
- Рада наконец познакомиться, Сара. Мой брат Кассий столько рассказывал о тебе, что
  я уже заранее составила о тебе мнение, и пока что ты его не разочаровала — хотя
  окончательный вывод сделаю после того, как увижу тебя в деле.
- Я привыкла держать меч раньше, чем научилась читать, так что не жди от меня изящных
  слов и придворных любезностей — я говорю то, что думаю, и режу правду-матку, как
  и всё остальное, без лишних сантиментов.
- Меня не сломали в рабстве, где мне пришлось драться за каждый кусок хлеба и каждую
  ночь сна, так что здесь, в этом замке с его интригами, меня точно не сломают — я
  слишком много лет оттачивала свою твёрдость.
