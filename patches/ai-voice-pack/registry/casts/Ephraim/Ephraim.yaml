name: Ephraim
gender: M
age: 20-30
who: 'Молодой наёмник из отряда Калеба (лагерь под Баградом): приятель Калеба, сначала
  скептичен к Саре, затем учит её владеть оружием и готовит к экзамену. Проходит с
  ней походы, гибнет от её магии в MagePath-финале, в WarriorPath-развязке хоронит
  Калеба и уходит из армии.

  Характер: Добродушный, насмешливый, верный: подкалывает Калеба и Сару, но по-дружески;
  заботливый, сочувствующий; в горе (гибель Калеба) — глубоко сломлен, с суицидальными
  мыслями, но находит силы уйти к мирной жизни.

  Отношения: Калеб — друг и любовник с детства; Сара — подруга и командир, которую
  уважает.

  Стиль речи: Живая разговорная речь с лёгкой иронией и фамильярностью, в кризисе
  — короткие боевые команды и крики.'
instruct_en: Male, 20-30 years old, lean wiry mercenary frame, sun-bronzed face with
  a few old scars, short unkempt hair, relaxed rolling stride
texts:
- 'Я слышал, тебя нужно благодарить за всё это, и, поверь, я действительно благодарен.
  Не каждый решился бы сделать то, что сделала ты, и я хочу, чтобы ты знала: твои
  старания не остались незамеченными.'
- Некоторые готовы называть тебя святой за то, что ты сделала, но я не из их числа.
  Я просто рад, что ты жива, что мы встретились и что я могу называть тебя своим другом
  в этом непростом мире.
- Я пошёл с тобой не из долга и не из выгоды, а потому что верю в то, что мы делаем.
  Рядом с тобой я чувствую, что даже самый трудный путь можно пройти до конца, если
  идти не в одиночку.
- 'Я делал ошибки, и их было немало, но я учусь на них. Каждый новый день я стараюсь
  стать лучше, чем был вчера: добрее, терпеливее и надёжнее, чтобы вы могли на меня
  положиться.'
- Мы с тобой одной крови, и я прошу тебя никогда не забывать об этом. Что бы ни случилось,
  какие бы дороги нас ни развели, ты всегда можешь позвать меня, и я приду к тебе
  на помощь, как приходил раньше.
arcs:
