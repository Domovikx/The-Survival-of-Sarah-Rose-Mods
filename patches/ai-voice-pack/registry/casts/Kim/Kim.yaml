name: Kim
gender: F
age: 18-20
who: 'Соседка Сары по бараку прислуги в поместье Гилеада (путь «Другое»): работница
  с большим стажем, учит Сару выживать — не выкладываться на работе, беречь силы.
  Поддерживает роман с охранником Натаном.

  Характер: Прагматичная, ленивая с умом, весёлая и болтливая: философия «работай
  вполсилы и протянешь годы, старательные выгорают». Грубовата, с юмором, без иллюзий
  об устройстве мира.

  Отношения: С Сарой — наставница-соседка, сразу берёт шефство; с Натаном — любовники;
  с остальными девушками — держится нейтрально-дружелюбно.

  Стиль речи: Разговорная просторечная речь: «Nah», «ain''t nobody», байки о жизни,
  сальные шутки, житейские притчи о богачах и беременных горничных.'
instruct_en: Female, 18-20 years old, maid, small neat figure, round cheerful face,
  quick busy hands, brisk bustling walk
texts:
- Я тут прибираю уже год, и поверь, я знаю каждый угол этого дома лучше его хозяев.
  Я могла бы рассказать тебе столько историй про эти стены, что волосы дыбом встанут,
  но начнём с малого.
- Я видела, как ты приехала, и сразу подумала, что нам будет о чём поговорить. Новые
  лица в этом доме редкость, а тут такая знатная гостья — как тут удержаться от любопытства!
- Я бы на твоём месте не ела их кашу сегодня. Кухарка с утра злая, а значит, соли
  в ней втрое больше обычного, и ужин обернётся испытанием для горла и терпения.
- Я слышала, что говорят про тебя на кухне, так что не бери в голову. Они про всех
  болтают, даже про самого герцога, когда он мимо проходит, так что ты в хорошей компании.
- Я пробралась в восточное крыло ночью, просто чтобы посмотреть, что там, и до сих
  пор не могу забыть этот холод. Ты же никому не расскажешь? А то мне не сносить головы.
- Я всегда знала, что уеду отсюда, вопрос только в том, куда и когда. Может, подамся
  в столицу или найду место в торговом караване — главное, не застрять здесь навеки.
