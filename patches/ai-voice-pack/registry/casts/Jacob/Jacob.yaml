name: Jacob
gender: M
age: 15-20
who: 'Сын трактирщика Рэмси, работает в семейной гостинице в Рахаяле; провожает Сару
  в комнату, позже его назначают обучать её работе — он отнекивается и убегает.

  Характер: Замкнутый и нелюдимый вопреки ожиданиям от сына весёлого трактирщика:
  избегает взгляда, говорит коротко и резко, всё время «занят», по словам сестры —
  не со зла. Мало данных: всего 8 реплик.

  Отношения: Сара — постоялица и новая работница, к которой демонстративно холоден;
  отец Рэмси и сестра Эльза, которые его оправдывают.

  Стиль речи: Предельно скуп: «There we go», «I''m busy right now» — односложные отговорки
  без извинений.'
instruct_en: Male, 15-20 years old, innkeeper's son, lanky teenage build, slouching
  posture, averted gaze, narrow shoulders, restless shuffling feet
texts:
- Вот и всё, готово! Ключ от вашей комнаты, держите — не потеряйте, у нас запасных
  нет, а мастер по замкам приходит только раз в месяц, и то не всегда трезвый, так
  что лучше поберечь.
- Я уже подменил постель свежим бельём и убрал со стола всё лишнее, а заодно проветрил
  комнату и поправил занавески — что ещё нужно, чтобы вам было удобно? Только скажите,
  я всё сделаю в два счёта.
- Я работаю в этой таверне с малых лет — сперва помогал на кухне, потом носил пиво
  и убирал за гостями, так что знаю здесь каждый уголок, каждую щель и каждого завсегдатая,
  который думает, будто умеет пить.
- 'Я пошёл работать за отцом, потому что именно он научил меня всему, что я умею:
  и как обращаться с гостями, и как чинить столы, и как считать выручку, — без него
  я бы, наверное, до сих пор путался под ногами.'
- 'Я всегда делал то, что просили: приносил, уносил, чинил и молчал, когда нужно было
  молчать. Не спорил, не жаловался, не лез с советами — так меня учил отец, и так
  я до сих пор живу.'
