name: Sigmund
gender: M
age: 25-35
who: 'Возница и перевозчик пиррита по Старой дороге из Летрама в Рахаяль. Встречает
  Сару у Летрама, поначалу принимая за сбежавшую девицу, даёт ей работу на повозке
  и довозит до Галлоу-Крик. Позже становится её любовником.

  Характер: Грубоватый, вспыльчивый, но по-своему заботливый: пытается отправить Сару
  в безопасность, а потом честно платит ей долю. Бывалый скептик с чёрным юмором про
  взрывы пиррита; лицо старое, но плечи широкие.

  Отношения: Сара — попутчица и работница, которую опекает; Сакар и Крип — его команда
  на повозке.

  Стиль речи: Просторечная, с обращением «girl», поговорками и практическими объяснениями
  (пиррит, Старая дорога); тон покровительственный, но справедливый.'
instruct_en: Male, 25-35 years old, wagoner and smuggler, broad-shouldered with a
  weathered prematurely aged face, strong workman's hands, easy relaxed carriage
texts:
- Я провёл ночь в лучших тавернах порта и каждую минуту наслаждался компанией весёлых
  людей и отличным вином. Моряки рассказывают такие истории, что ни один менестрель
  не повторит, а я умею их слушать.
- Я делал вид, что потерян и одинок, чтобы вызвать сочувствие у окружающих, и это
  всегда помогало мне получить то, что нужно. Люди любят чувствовать себя спасителями,
  и грех не воспользоваться их добротой.
- Я сегодня утром обнаружил в своём кармане интересный артефакт, которого там точно
  не было вчера вечером. Как он туда попал — загадка, но в моём ремесле принято не
  задавать лишних вопросов подаркам судьбы.
- Мы с тобой уже давно знакомы, и ты должен знать, что я никогда не упускаю возможности
  повеселиться за чужой счёт. Жизнь слишком коротка, чтобы отказывать себе в маленьких
  радостях, особенно если они ничего не стоят.
- Я всегда старался держать ситуацию под контролем, даже когда казалось, что всё идёт
  не по плану, потому что настоящий плут всегда имеет запасной выход — так же, как
  хороший возница всегда знает дорогу в объезд.
