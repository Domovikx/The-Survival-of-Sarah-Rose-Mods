name: Raza
gender: M
age: 30-40
who: 'Гоблин-раб у орков в снежных горах (Hyral): кормит пленную Сару, заключает с
  ней сделку — проводить её к человеческому городку в обмен на защиту. После передумавшего
  бегства становится её хозяином-насильником в своём жилище.

  Характер: Двуликий выживальщик: сначала тихий, услужливый, даже добрый, объясняет,
  что сам раб; при первой же власти над Сарой — резкий, злой, физически жестокий,
  требует послушания и принуждает к сексу.

  Отношения: С Сарой — от проводника-спасителя к жестокому хозяину; с орками — раб,
  выполняющий поручения.

  Стиль речи: Ломаный английский без артиклей и связок: «Me slave, just like you»,
  «You stupid? Why you make fire?» — грубый, прямой.'
instruct_en: Male, 30-40 years old, goblin slave, small wiry stooped frame, sharp
  sallow face with pointed ears and yellow eyes, lanky greasy hair, scuttling furtive
  movements
texts:
- Я раб, как ты, и я знаю, как орки смотрят на рабов! Я приношу еду, я делаю работу,
  я не смотрю им в глаза, и живу, потому что умею прятаться и угождать!
- 'Ты идти со мной? Я знаю тропу к человеческому городку, я провёл туда не одну душу!
  Но услуга за услугу: ты защищаешь меня, я веду тебя, а потом каждый идёт своей дорогой!'
- Орки думают, что я тупой, а я слышу всё! Я знаю, где они прячут еду, где спят и
  когда уходят на охоту! Гоблин живёт умом, а не мускулами, и это моё оружие!
- Не смотри на меня так, человечка! Я такой же пленник, как ты, я тоже боюсь кнута
  и печей, но я не умер, и ты не умрёшь, если будешь слушать меня и делать, что я
  говорю!
- Я принёс тебе еду, как велели, и в ней нет яда! Орки сказали кормить рабыню — я
  кормлю, ибо даже маленькая милость к рабу — это залог того, что однажды он не перережет
  тебе горло!
arcs:
- Other
