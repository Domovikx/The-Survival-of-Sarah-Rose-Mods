name: Atilla
gender: M
age: 25-30
who: 'Орк-наёмник, боевой инструктор Сары: берётся тренировать её за плату «сколько
  переживёт», позже — возлюбленный и муж. Дарит ожерелье из призрачного серебра и
  цветок с горной вершины, делает предложение.

  Характер: Грубый, резкий, прямолинейный, без стыда за наготу и сексуальность. За
  брутальной внешностью — преданность и романтика: хранит память о первой жене, годами
  скрытно следил за Сарой, ослабляя её врагов; честен до жестокости.

  Отношения: С Сарой — от тирана-инструктора через любовников к мужу; называет «girl»,
  «small one», «little one»; с войском Камала — примкнул наёмником, чтобы воевать
  против её будущих врагов.

  Стиль речи: Короткие рубленые фразы, приказы, грубоватый юмор, минимум слов — максимум
  веса; прозвища-обращения вместо имён.'
instruct_en: Male, 25-30 years old, orc warrior, tall and powerfully built with a
  broad muscular frame, strong jaw on a weathered scarred face, short dark hair, confident
  rolling gait of a veteran warrior, thick corded arms
texts:
- Я прошёл через десятки сражений, и каждое из них научило меня ценить тех, кто стоит
  рядом с тобой плечо к плечу. В бою нет места гордыне, там важна только верность,
  и я помню каждого, кто прикрывал мне спину, как помню каждый свой шрам.
- Я делал то, что считал правильным, даже когда все вокруг кричали, что я ошибся.
  Настоящий воин стоит за свои убеждения, даже если земля горит под ногами, и я скорее
  лягу костьми, чем предам то, во что верю всем сердцем.
- Я видел, как падали великие города и как из пепла рождались новые надежды. И всё
  это время я держал своё слово и не бросал товарищей, потому что без них любой воин
  — просто одинокий меч, обречённый ржаветь в ножнах.
- 'Мы стояли вместе перед лицом неминуемой гибели, и именно тогда я понял простую
  истину: настоящая сила не в мечах и не в доспехах, а в доверии. Тот, кто прикрывает
  твою спину, дороже золота, и я это усвоил навсегда.'
- 'Я всегда говорил правду, даже когда она была горше полыни, потому что ложь — это
  удел слабых и трусов. Я выбрал путь чести: мой народ знает, что моё слово крепче
  стали, и за это я готов отвечать головой.'
