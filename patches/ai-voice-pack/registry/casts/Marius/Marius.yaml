name: Marius
gender: M
age: 25-35
who: 'Мариус — сын фермера Альфреда из Гэллоу-Крика: в пору жатвы приютил Сару и влюбился,
  но отец (владелец земель) сам женился на ней; Мариус вынужден смириться.

  Характер: Добрый, работящий, открытый парень, «юноша, не привыкший к похвале»; застенчив
  и почтителен с отцом до подобострастия. При известии о браке вспыхивает гневом,
  но быстро гаснет в покорность.

  Отношения: С отцом Альфредом — зависимый трепетный сын; с Сарой — гостеприимный
  хозяин, влюблённый и разбитый соперник отца.

  Стиль речи: Деревенское просторечие: «Ain''t never got enough hands», вежливые «sir»,
  «sorry bout».'
instruct_en: Male, 25-35, bright friendly tenor with an easy charm, energetic and
  streetwise, quick casual delivery
texts:
- Меня, кстати, зовут Мариус, и я здесь не первый день, так что если тебе нужны нужные
  люди, нужные двери или нужные слова в нужный момент — ты просто не нашла ещё лучшего
  попутчика, чем я.
- Взаимно, Сара, верно? Слышал о тебе немало, но, как говорится, лучше один раз увидеть,
  чем сто раз услышать, — и, должен признаться, слухи оказались куда бледнее настоящего,
  и я этому даже рад.
- Я пошёл с тобой не из жалости и не из выгоды, а потому, что мне по-настоящему интересно,
  чем всё это закончится, — а я, между прочим, человек, который умеет выбирать истории
  получше.
- 'Я за свою жизнь наделал столько глупостей, что хватило бы на целую книгу, но, что
  забавно, ни разу о них не пожалел: каждая из них привела меня туда, где я должен
  был оказаться.'
- Ты удивительная женщина, и, судя по тому, как ты держишься и как говоришь, ты сама
  об этом знаешь, но всё равно приятно услышать это от человека, который видал немало
  — верно?
