name: Eula
gender: F
age: 20-30
who: 'Юла — сокамерница Сары в тюрьме: бывалая «тюремная мама», показывает расклад
  по блокам и учит выживать; советует через секс с надзирателем Эдгаром доставать
  вещи с воли.

  Характер: Грубая, беззастенчивая, себе на уме; при знакомстве напускает «крутость»,
  но по-своему заботлива и честна; цинично-практична во всём, что касается тюрьмы.

  Отношения: С Сарой — наставница-сокамерница, искренне оберегает её; с надзирателями
  и другими заключёнными — знает все связи, иерархию и «кто кто» на блоке.

  Стиль речи: Уличный жаргон с матом; прозвища («blondie», «newbie»), резкая разговорная
  манера.'
instruct_en: Female, 20-30 years old, hardened prisoner, sturdy thick-set build with
  broad shoulders, hard angular face, unkempt hair, heavy swaggering gait
texts:
- Ну и какого хрена ты такая чистенькая и довольная, и что ты вообще делаешь в моей
  камере? Сюда даже стражники заходят только с оглядкой, а ты разгуливаешь тут, будто
  у меня на постое.
- 'Я пошла на сделку с охранником: он приносит мне вино и новости, а я закрываю глаза
  на его мелкие шалости с казённым добром. Не идеальный расклад, но работает, а в
  тюрьме не выбирают партнёров по картам.'
- Я резалась в кости с лучшими игроками этого королевства — с купцами, с офицерами,
  даже с одним епископом, — и почти всегда выигрывала, потому что умею считать не
  хуже, чем блефовать.
- Меня не сломала тюрьма с её холодными стенами и пустой похлёбкой, так что у тебя
  точно не выйдет — я уже столько лет играю по-крупному, что любая твоя уловка мне
  знакома ещё до того, как ты её придумала.
- 'Я ставила на всё, что движется: на карты, на людей, на чужую жизнь и даже на свою
  собственную, — и, надо сказать, обычно выигрывала, потому что в этом мире главное
  не везение, а умение просчитать того, кто сидит напротив.'
