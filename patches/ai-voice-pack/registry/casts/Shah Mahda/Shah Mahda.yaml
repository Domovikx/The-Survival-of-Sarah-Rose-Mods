name: Shah Mahda
gender: M
age: 40-60
who: 'Гордый правитель древней династии города Баград, осаждённого митранской армией:
  нанимает орден магов (Ксана и Сару) для обороны, а когда те «предают» его — призывает
  союзника с той стороны реальности ритуальным кинжалом; в конце сдаёт ключи от сокровищницы
  ради безопасности дочери.

  Характер: Высокомерен до мании величия, ни во что не ставит ни магов, ни врагов.
  Непоколебим перед казнью, но рассыпается, когда правда о поражении доходит до него.
  В финале — сломлен, но не подл: отдаёт направления к хранилищу за обещание сохранить
  жизнь дочери.

  Отношения: Ксан и Сара — нанятые маги, которых третирует; дочь Самайра — единственное,
  ради чего он сдаётся; митранский принц — враг, которого он провоцирует.

  Стиль речи: Величественный, приказной, риторический; пафосные речи о династии и
  чести; без единой фамильярности — только титулы и приказы.'
instruct_en: Male, 40-60 years old, shah, tall and imposing with a heavy build, bearded
  weathered face, proud stiff-backed posture, slow measured gait
texts:
- Волшебник, ты вернулся с фронта, — я вижу по твоему лицу, что битва была не из лёгких,
  но мой трон стоит крепко, и я хочу услышать от тебя, что с моей армией.
- 'Скажи мне, как идёт битва: мне докладывают разное, но я не верю ни одному слову
  без подтверждения, поэтому говори сам, своими словами, и помни — ложь во дворце
  наказывается строже, чем поражение на поле.'
- Я правил этим королевством сорок лет — дольше, чем ты живёшь на свете, — и пережил
  больше заговоров, войн и голодов, чем ты успел увидеть снов, поэтому не поучай меня,
  а слушай и исполняй.
- 'Я делал то, что было необходимо, и никогда не оправдываюсь перед теми, кто не способен
  понять цену решений: мой народ сыт, мои границы целы, а всё остальное — лишь голоса
  тех, кто сам не держал власть.'
- 'Мой трон стоит на костях моих врагов — так было, когда я его занял, и так будет,
  пока я жив: каждый, кто посягнёт на мою власть, пополнит основание, на котором я
  сижу.'
