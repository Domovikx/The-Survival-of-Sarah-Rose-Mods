name: Daemon
gender: M
age: ageless
who: 'Демон-хозяин цитадели в DemonArc: похищает и обращает Сару и Далию в своих «питомцев»/рабынь
  в подземельях.

  Характер: Садистский, властный и насмешливый: играет с непокорностью жертв, требует
  доказательств преданности, унижает. Холодно расчётливый: обещает милость за подчинение,
  карает за дерзость. Спокоен и уверен в своей власти.

  Отношения: С Сарой — пленитель/хозяин, ломает её волю; с Далией — «любимая» рабыня,
  образец покорности; к другим — презрение.

  Стиль речи: Речь властная, издевательски-ласковая («little pet», «slave», «whore»),
  приказы и угрозы, наслаждение чужой покорностью.'
instruct_en: Male, ageless demon, towering and unnaturally still, broad powerful frame
  as if carved from shadow, angular severe features, cold unblinking eyes, unhurried
  predatory gait
texts:
- Я ждал тебя долго, смертная, — дольше, чем ты способна вообразить. Я считал твои
  шаги задолго до того, как ты сделала первый из них, и знал твоё имя прежде, чем
  его впервые произнесли вслух.
- 'Я видел, как рушатся миры: целые эпохи осыпались пеплом у моих ног, и я шагал по
  этому пеплу, не оглядываясь. Твой мир не станет исключением — вопрос лишь в том,
  падёт он в этом веке или в следующем. Я умею ждать.'
- 'Я дал тебе кров, и я же могу его отнять. Запомни это, смертная: всё, что ты здесь
  видишь, держится на моей воле, а воля моя переменчива, как тени на стене при свете
  догорающей свечи.'
- Я помню каждый голос, что звучал в этих стенах, — от первого шёпота до последнего
  крика. Скоро их станет на один больше, и этот голос будет звучать в моей памяти
  вечно, как звучат все остальные.
- 'Я не желаю тебе зла, девочка. Я лишь следую природе вещей: пламя не ненавидит солому,
  когда пожирает её, и река не таит злобы на камень, который точит. Так и я — я просто
  делаю то, для чего был создан.'
- Я был здесь до того, как заложили первый камень этого замка, и останусь после того,
  как рухнет последний. Короли, войны, молитвы — всё это лишь рябь на моей воде, а
  я не сдвинусь с места.
arcs:
- DemonArc
instruct_ru: Мужской, без возраста, демон, высокий и неестественно неподвижный, широкая
  мощная фигура, будто высеченная из тени, угловатые суровые черты, холодные немигающие
  глаза, неторопливая хищная поступь
