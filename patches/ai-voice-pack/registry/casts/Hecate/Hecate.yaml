name: Hecate
gender: F
age: 30-45
who: 'Ведьма Ордена и знаменитая исследовательница, подруга Ксанфиппа; в руинах древнего
  города выслеживает магический импульс, находит Сару и объединяется с ней, позже
  участвует в делах Ордена и в близких сценах с Габриэлем и Сарой.

  Характер: Дерзкая, бойкая, самоуверенная, болтливая и ехидная — подкалывает слугу
  Габриэля, но и кокетлива, азартна, любопытна; месяцами лезла через джунгли за сигналом.

  Отношения: С Габриэлем — ворчливо-нежная пара «госпожа-слуга» (перерастает в роман);
  с Сарой — старшая подруга-наставница; с Ксанфиппом — давняя приятельница по Ордену.

  Стиль речи: Живая разговорная речь: восклицания, сарказм, преувеличения, перебивки;
  обидчивые риторические вопросы.'
instruct_en: Female, 30-45 years old, witch and scholar, statuesque tall figure with
  a slender commanding build, sharp elegant features, long dark hair, straight proud
  posture, unhurried gliding gait
texts:
- Беги, сейчас же, не стой как вкопанная! Посади как можно больше людей на эти корабли
  — каждый час промедления стоит нам жизней. Я задержу их здесь столько, сколько смогу,
  а ты делай своё дело, не оглядываясь.
- 'Я пошла на этот шаг, потому что некому было больше: все, кто мог помочь, либо сбежали,
  либо смотрели в другую сторону. Кто-то должен был взять на себя ответственность,
  и я решила, что лучше я, чем тот, кто сломается на полпути.'
- 'Я делала то, что было необходимо, и не спрашивай меня о методах: некоторые из них
  ты не захочешь услышать. Магия требует жертв, и я давно научилась платить по счетам
  — не морщась и не ища сочувствия у тех, кто меня осудит.'
- 'Пожалуйста, Габриэль, доверься мне хоть раз, хорошо? Я знаю, что мои слова звучат
  как загадка, и понимаю, как тебе трудно. Но у меня нет времени объяснять всё до
  мелочей: просто сделай, как я прошу, и я обещаю рассказать всё потом.'
- 'Магия — это не дар, как многие думают. Это бремя, которое я несу с рождения: каждый
  голос в моей голове, каждое предчувствие беды, каждое лицо, что я вижу в пламени
  свечи. Меня не спрашивали, хочу ли я этого, но выбора не было.'
arcs:
- MagePath
- Other
instruct_ru: Женский, 30-45 лет, ведьма и исследовательница, статная высокая фигура,
  стройное властное телосложение, острые элегантные черты лица, длинные тёмные волосы,
  прямая горделивая осанка, неторопливая скользящая походка
