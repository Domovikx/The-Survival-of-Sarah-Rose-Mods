<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Плашка: фон лендинга, скруглённые углы — знак выживает на светлой панели
       задач, потому что несёт собственную тёмную подложку. -->
  <rect width="1024" height="1024" rx="210" fill="#141824" />

  <!-- Знак — эквалайзер (выбор владельца 2026-11-20): тот же, что в шапке,
       отмасштабирован по сетке. Полосы 96, зазор 48, центр 512. -->
  <g fill="#9aa6f5">
    <rect x="176" y="412" width="96" height="200" rx="48" />
    <rect x="320" y="332" width="96" height="360" rx="48" />
    <rect x="464" y="232" width="96" height="560" rx="48" fill="#5563d8" />
    <rect x="608" y="332" width="96" height="360" rx="48" />
    <rect x="752" y="412" width="96" height="200" rx="48" />
  </g>
</svg>
